# The Millennium Prize Problem this project works on.
# track: lean  -> gaps are Lean statements checked automatically
- slug: pvsnp
  # Trusted HTML, shown large on the card and the problem page.
  formula: 'P <span class="rel">≟</span> NP'
  name: P versus NP
  track: lean
  clay: https://www.claymath.org/millennium-problems/
  summary: >-
    If a solution to a problem can be checked quickly, can it also be found quickly?
  statement: >-
    "Quickly" means in time bounded by a polynomial in the size of the input. P is the class
    of problems solvable that fast; NP is the class whose solutions can be verified that fast.
    Most researchers expect P ≠ NP, but no proof exists in either direction.
  lean: >-
    Draft definitions of P and NP, built on Mathlib's multi-stack Turing machines, are in
    lean/MPP/Defs/PvsNP.lean. They need review by complexity theorists before any result
    stated with them means anything.
