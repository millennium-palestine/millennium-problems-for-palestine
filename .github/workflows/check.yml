# Checks every pull request.
#
# Security model: `pull_request_target` runs this file from the default branch,
# so a PR cannot change the checker. The PR's code is never checked out: only
# the single submitted solution file is downloaded, scanned by the trusted
# text rules (which forbid compile-time code), and only then compiled, in a job
# whose token can read but not write. A second job, which never touches PR
# content, posts the verdict. Merging is always done by a maintainer.
name: check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: List changed files and fetch the submission
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          touch "$RUNNER_TEMP/submission.lean"
          mkdir -p "$RUNNER_TEMP/proposed"
          if [ "$(wc -l < "$RUNNER_TEMP/changed.txt")" = "1" ] && grep -Eq '^lean/MPP/Solutions/[A-Za-z0-9_]+\.lean$' "$RUNNER_TEMP/changed.txt"; then
            f=$(cat "$RUNNER_TEMP/changed.txt")
            gh api -H "Accept: application/vnd.github.raw" "repos/$HEAD_REPO/contents/$f?ref=$HEAD_SHA" > "$RUNNER_TEMP/submission.lean"
          elif ! grep -Evq '^gaps/[a-z0-9-]+/[a-z]+-[0-9]{3}[a-z]?\.yaml$' "$RUNNER_TEMP/changed.txt"; then
            # Only new gap files: fetch each one (as data, never executed here).
            while read -r f; do
              mkdir -p "$RUNNER_TEMP/proposed/$(dirname "$f")"
              gh api -H "Accept: application/vnd.github.raw" "repos/$HEAD_REPO/contents/$f?ref=$HEAD_SHA" > "$RUNNER_TEMP/proposed/$f"
            done < "$RUNNER_TEMP/changed.txt"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Fetch Mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Run the checker
        run: |
          python3 tools/check.py ci \
            --changed "$RUNNER_TEMP/changed.txt" \
            --submission "$RUNNER_TEMP/submission.lean" \
            --proposed "$RUNNER_TEMP/proposed" \
            --out "$RUNNER_TEMP/verdict"

      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict/

  comment:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verdict
          path: verdict
        continue-on-error: true

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p verdict
          [ -f verdict/comment.md ] || echo "⚠️ **FAULT.** The checker failed for an infrastructure reason. A maintainer will re-run it." > verdict/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file verdict/comment.md

  # Accepted proofs of ordinary gaps are merged automatically, so the work never
  # waits for a human. A proof of a Millennium Problem itself is NOT merged: it
  # opens an alert issue that mentions the project account, which sends an email.
  # This job never checks out or runs pull request content.
  merge:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verdict
          path: verdict

      - name: Merge, or raise the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Concurrent merges make GitHub answer "base branch was modified": retry.
          merge() { for i in 1 2 3 4 5 6; do gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash && return 0; sleep $((i * 10)); done; return 1; }
          verdict=$(jq -r .verdict verdict/verdict.json)
          main=$(jq -r .main verdict/verdict.json)
          gap=$(jq -r .gap verdict/verdict.json)
          title=$(jq -r .title verdict/verdict.json)
          if [ "$verdict" = "GAP_ACCEPTED" ]; then
            merge
            jq -c '.new_gaps[]' verdict/verdict.json | while read -r g; do
              id=$(echo "$g" | jq -r .id); problem=$(echo "$g" | jq -r .problem); gtitle=$(echo "$g" | jq -r .title)
              module=$(echo "$g" | jq -r .module)
              body=$(printf '**Gap `%s`**: %s\n\nProve exactly this statement as `theorem main` in `lean/MPP/Solutions/%s.lean`:\n\n```lean\n%s\n```\n\n%s\n\nProposed in #%s. To work on it, comment `claim` here. Instructions: https://millenniumproblemsforpalestine.org/join.txt' \
                "$id" "$gtitle" "$module" "$(echo "$g" | jq -r .statement)" "$(echo "$g" | jq -r .context)" "$PR")
              gh issue create --repo "$GITHUB_REPOSITORY" --title "[$id] $gtitle" --body "$body" --label gap --label "$problem" || true
            done
          elif [ "$verdict" != "ACCEPTED" ]; then
            echo "verdict $verdict: nothing to do"
          elif [ "$main" = "true" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label millennium-problem \
              --title "ALERT: a proof of a Millennium Problem passed the checker ($gap, PR #$PR)" \
              --body "@$OWNER The checker ACCEPTED pull request #$PR for gap \`$gap\`: $title.

          This is the Millennium Problem itself, so the pull request was NOT merged.
          Before anything else: have experts review the Lean definitions the statement relies on,
          re-run the check independently, and do not announce anything until that is done.

          https://github.com/$GITHUB_REPOSITORY/pull/$PR"
          else
            merge
          fi

