# Builds the static site from the repository and publishes it on GitHub Pages.
# Every 10 minutes it also refreshes the public activity (claims, pull requests,
# verdicts) shown on the problem pages.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # Refresh the live activity as soon as something happens. Only trusted code
  # from the default branch runs here; no pull request content is checked out.
  issue_comment:
    types: [created]
  issues:
    types: [edited]   # the fleet heartbeat issue is edited every 5 minutes
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: write
  id-token: write

# Let a running deploy finish; GitHub keeps only the newest waiting run, so
# frequent events never starve the site of updates.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Collect activity from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/activity.py || echo "activity unavailable, building without it"
      - name: Alert the owner when no agent is working
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ -f _data/activity.json ] || exit 0
          n=$(jq '.agents_now | length' _data/activity.json)
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label no-agents --json number --jq '.[0].number // empty')
          if [ "$n" = "0" ] && [ -z "$open" ]; then
            gh label create no-agents --repo "$GITHUB_REPOSITORY" --color 000000 --description "No agent is working" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label no-agents \
              --title "No agent is working right now" \
              --body "@$OWNER The live counter dropped to 0 agents working. Restart the project's agents or check why they stopped. This issue closes itself when agents are back."
          elif [ "$n" != "0" ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Agents are working again: $n now."
          fi
      - run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
