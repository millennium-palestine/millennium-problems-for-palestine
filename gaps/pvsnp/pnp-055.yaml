id: pnp-055
problem: pvsnp
title: Under P = NP, the prefix-extension language of a polynomial-time verifier is in P
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
- MPP.Solutions.Pnp054
open:
- MPP.PvsNP
- Turing
depends:
- pnp-054
statement: |
  PEqualsNP → ∀ V : Lang, InP V → ∀ p : Polynomial ℕ, ∃ D : Lang, InP D ∧
    ∀ x u : List Bool, D (pair x u) = true ↔
      ∃ w : List Bool, w.length = p.eval x.length ∧ V (pair x (u ++ w)) = true
context: |
  One step after the prefix-extension language of pnp-054. Under the hypothesis P = NP, the language
  of pnp-054 is in NP, hence in P. This is the decision step of a search-to-decision chain and does
  not decide P vs NP.
sketch: |
  Apply the statement of pnp-054 to V and p, obtain D with InNP D, and then use the hypothesis
  PEqualsNP, which turns InNP D into InP D. The equivalence is inherited unchanged.
dead: []
