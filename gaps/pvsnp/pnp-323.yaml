id: pnp-323
problem: pvsnp
title: A primitive balanced block of pairs gives the same run on every stack tail, given the same for its middle
status: open
imports:
- Mathlib
- MPP.Solutions.Pnp212
open: []
depends: []
statement: |
  ∀ (F : List Bool × List Bool × Option Bool → Bool → List Bool × List Bool × Option Bool), F = (fun (st : List Bool × List Bool × Option Bool) (b : Bool) => match st.2.2 with | none => (st.1, st.2.1, some b) | some a => if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none) else (st.1, st.2.1, none)) else (if b then (st.1.headD false :: st.1, st.2.1, none) else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) →
    ∀ (Rel : List (Bool × Bool) → List Bool → Bool → Bool → Prop),
    (∀ (q : List (Bool × Bool)) (T : List Bool) (v g : Bool), Rel q T v g ↔ ∃ w : List Bool, w.length = q.countP (fun x : Bool × Bool => !x.1 && !x.2) ∧ ∃ w' : List Bool, (q.flatMap fun r : Bool × Bool => [r.1, r.2]).foldl F (v :: T, w, none) = (g :: T, w', none)) →
    ∀ (a c : Bool × Bool) (mid : List (Bool × Bool)), a.1 = false → c = (true, true) →
    (mid.map fun r : Bool × Bool => if r.1 && r.2 then (-1 : ℤ) else if r.1 then 0 else 1).sum = 0 →
    (∀ j, j ≤ mid.length → 0 ≤ ((mid.map fun r : Bool × Bool => if r.1 && r.2 then (-1 : ℤ) else if r.1 then 0 else 1).take j).sum) →
    (∀ (T T' : List Bool) (u g : Bool), Rel mid T u g → Rel mid T' u g) →
    ∀ (t t' : List Bool) (v g : Bool), Rel (a :: (mid ++ [c])) t v g → Rel (a :: (mid ++ [c])) t' v g
context: |
  Tail independence of the interval table for the pnp-152 route, primitive step. Rel q T v g says that the fold of pnp-133, run on
  the pair list q from the stack v :: T with a witness of exact length, ends with top g and the same tail T. The fact to prove is
  that a balanced nonnegative block never reads below its input, so the output top and the witness use do not depend on the
  stack under the block. This is the primitive case (an up step, a balanced middle, a NAND down step) of that fact. The up step
  is a copy or a leaf, and pnp-212 gives the run of the block as an existential over the top u of the up step; the middle is then
  run over the tail v :: T, and the hypothesis on the middle moves it to the tail v :: T'. Without this fact the interval relation
  of the pnp-287 table would need the value under the block as a second argument. It is a fact about lists of pairs and the fold:
  no machine, no polynomial bound, no P, and it does not decide P vs NP. Not the same as the one-step facts pnp-281, pnp-282 and
  pnp-284, which concern a single NAND or leaf pair.
sketch: |
  Rewrite the hypothesis on Rel (a :: (mid ++ [c])) t with the iff of pnp-212 at t, obtaining u, the condition a.2 = true → u = v,
  a middle run Rel mid (v :: t) u g' and g = !(g' && v). Apply the hypothesis on the middle with T := v :: t and T' := v :: t' to
  get Rel mid (v :: t') u g'. Then the iff of pnp-212 at the tail t' gives Rel (a :: (mid ++ [c])) t' v g. Each step is an iff
  rewrite and one application; the witness of the block is the witness of the middle with one bit in front for a leaf.
