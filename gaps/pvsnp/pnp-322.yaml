id: pnp-322
problem: pvsnp
title: The run of balanced blocks with NAND pairs leaves the top and witness given by an explicit chain over the block tops
status: open
imports:
- Mathlib
- MPP.Solutions.Pnp198
- MPP.Solutions.Pnp200
open: []
depends:
- pnp-198
- pnp-200
statement: |
  ∀ (items : List (List (Bool × Bool))) (T : List (Bool × Bool)),
    (∀ b ∈ items, (b.map fun r : Bool × Bool => if r.1 && r.2 then (-1 : ℤ) else if r.1 then 0 else 1).sum = 0 ∧
      ∀ j, j ≤ b.length → 0 ≤ ((b.map fun r : Bool × Bool => if r.1 && r.2 then (-1 : ℤ) else if r.1 then 0 else 1).take j).sum) →
    ∀ (v : Bool) (t w : List Bool),
      ((((items.map fun b => b ++ [(true, true)]).flatten ++ T).flatMap fun r => [r.1, r.2]).foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
    match st.2.2 with
    | none => (st.1, st.2.1, some b)
    | some a =>
      if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
        else (st.1, st.2.1, none))
      else (if b then (st.1.headD false :: st.1, st.2.1, none)
        else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) (v :: t, w, none)) =
      let ch := items.foldl (fun (s : Bool × List Bool × List Bool) b =>
        let R := (b.flatMap fun r => [r.1, r.2]).foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
    match st.2.2 with
    | none => (st.1, st.2.1, some b)
    | some a =>
      if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
        else (st.1, st.2.1, none))
      else (if b then (st.1.headD false :: st.1, st.2.1, none)
        else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) ([s.1], s.2.2, none)
        (!(R.1.headD false && s.2.1.headD false), s.2.1.drop 1, R.2.1)) (v, t, w)
      ((T.flatMap fun r => [r.1, r.2]).foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
    match st.2.2 with
    | none => (st.1, st.2.1, some b)
    | some a =>
      if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
        else (st.1, st.2.1, none))
      else (if b then (st.1.headD false :: st.1, st.2.1, none)
        else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) (ch.1 :: ch.2.1, ch.2.2, none))
context: |
  Explicit form of the block recurrence for the pnp-152 route, the assembly step left open by pnp-268. pnp-268 says
  that a sequence of balanced nonnegative blocks, each followed by a NAND pair, runs as one new top over the stack
  with one cell dropped per block, but its top is only an existential g. Here the top is given by a chain: start
  from the input top v and the witness w, and for each block b read its top R.1 from the one-cell stack [current top]
  and the current witness. The next top is NAND(R.1, head of the remaining stack), the remaining stack loses its head,
  and the witness is the one left by the block. This is the CYK-style table on blocks written out as a fold, and it
  is a fact about lists of pairs and the fold of pnp-133: no machine, no polynomial bound, no P, and it does not
  decide P vs NP. It is the list-level step that a polynomial-time table for the pnp-152 language would need to
  compute.
sketch: |
  Induction on items, generalising v, t and w. For the empty list the chain is (v, t, w) and both sides are the fold
  of T from (v :: t, w, none). For b :: rest, the flatten of the NAND-mapped list is (b ++ [(true, true)]) followed by
  the flatten of rest, so List.map_cons, List.flatten_cons, List.flatMap_append, List.foldl_append apply. By pnp-198
  the block b leaves (g :: t, w', none) from (v :: t, w, none) for some g and w'; by pnp-200 with the empty tail
  the same block leaves ([g], w', none) from ([v], w, none), so R.1.headD = g and R.2.1 = w' in the chain. The pair
  (true, true) on (g :: t, w', none) gives (!(g && t.headD false)) :: t.drop 1 with witness w', by unfolding the fold
  on two bits. The induction hypothesis on rest, with v' = !(g && t.headD false), t' = t.drop 1 and w' gives the
  claim, since the chain on b :: rest is the chain on rest from the new state.
