id: pnp-133
problem: pvsnp
title: Satisfiability of postfix programs with shared values and witness leaves is in NP
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- MPP.PvsNP
- Turing
depends:
- pnp-132
statement: |
  ∃ L : Lang, InNP L ∧ ∀ x : List Bool, L x = true ↔ ∃ w : List Bool, w.length ≤ x.length ∧
    (x.foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
      match st.2.2 with
      | none => (st.1, st.2.1, some b)
      | some a =>
        if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
          else (st.1, st.2.1, none))
        else (if b then (st.1.headD false :: st.1, st.2.1, none)
          else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) ([], w, none)).1.headD false = true
context: |
  Membership side of a circuit language with fan-out, the version of pnp-124 with the copy
  instruction of pnp-132. The witness is an assignment to the leaves, of length at most |x|, and the
  verifier of pnp-132 checks it in polynomial time, so the language is in NP. As with pnp-124, this
  gap does not decide P vs NP. It gives no hardness: the reduction of pnp-100 still needs a
  polynomial-time map that writes, for a fixed verifier, such a program for every input.
sketch: |
  Take L to be the language in the statement and let V be the verifier of pnp-132, with the
  polynomial X. Then the witness bound is w.length ≤ x.length and V (pair x w) is the fold of the
  statement, by the equation of pnp-132. The two sides agree on every x by unfolding InNP and that
  equation. This is the proof of pnp-124 with the verifier of pnp-132 in place of pnp-123.
