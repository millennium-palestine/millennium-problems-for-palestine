id: pnp-109
problem: pvsnp
title: A TM2 block with at most b pops per path leaves each stack as a fixed prefix on the old stack minus a fixed number of symbols
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- Computability
- Turing
depends: []
statement: |
  ∀ (K : Type) [DecidableEq K] (Γ : K → Type) (Λ σ : Type) (q : TM2.Stmt Γ Λ σ) (b : ℕ),
    TM2.Stmt.rec (motive := fun _ => ℕ) (fun _ _ _ ih => ih) (fun _ _ _ ih => ih)
      (fun _ _ _ ih => ih + 1) (fun _ _ ih => ih) (fun _ _ _ ih₁ ih₂ => max ih₁ ih₂) (fun _ => 0) 0 q ≤ b →
    ∀ (v : σ) (S S' : ∀ k, List (Γ k)), (∀ k, (S k).take (b + 1) = (S' k).take (b + 1)) →
      ∃ (L : ∀ k, List (Γ k)) (m : ∀ k, ℕ), (∀ k, m k ≤ b) ∧
        ∀ k, (TM2.stepAux q v S).stk k = L k ++ (S k).drop (m k) ∧
          (TM2.stepAux q v S').stk k = L k ++ (S' k).drop (m k)
context: |
  Stack-shape lemma for the Cook–Levin tableau of pnp-100, the stack part of the window that pnp-108
  starts. pnp-108 says that a block with at most b pops per path has the same next label, next variable
  and stack tops when two stacks agree on their top b + 1 symbols. This gap says more: the new stacks are
  again determined by those top symbols. For each stack k there is a prefix L k, pushed on top, and a
  number m k ≤ b of symbols removed from the top, and both runs use the same L and the same m. So the
  stack-as-tape simulation can write each block's effect as "prepend a fixed word, drop a fixed
  number of cells". This is a fact about one block, not about any language, and it does not decide
  P vs NP.
sketch: |
  Induction on q, generalising b, v, S and S'. Peek and load: the continuation gets the same variable,
  because the head symbols agree (take (b + 1) with b + 1 ≥ 1 contains the head), and the budget is
  unchanged. Goto and halt: L = empty and m = 0. Branch: the test f v is the same for both runs, so
  the induction hypothesis of the chosen side applies, with budget max ≤ b. Push k f q: the stack k
  becomes f v :: S k on both sides, and take b of the tails agree, so the hypothesis is used at the same
  b on the updated stacks; if the returned m k is 0 put f v in front of L k, otherwise m k - 1 is the
  shift on S k. Pop k f q: the depth gives PD q + 1 ≤ b, so b ≥ 1, and the continuation runs at budget
  b - 1 on the updated stacks (update S k tail), whose take b agree; the result for S k is L k with
  m k + 1, since drop m (tail) = drop (m + 1) on the original stack.
