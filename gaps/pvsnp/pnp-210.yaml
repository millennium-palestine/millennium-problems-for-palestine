id: pnp-210
problem: pvsnp
title: After t steps of the window rule, a cell depends only on the old cells from its position to its position plus k t
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (k : ℕ) (G : List Bool → Bool) (n t : ℕ) (r r' : List Bool), r.length = n → r'.length = n →
    ∀ i, (∀ j, i ≤ j → j ≤ i + k * t → r.getD j false = r'.getD j false) →
      ((fun q : List Bool => (List.range n).map fun i =>
        G ((List.range (k + 1)).map fun j => q.getD (i + j) false))^[t] r).getD i false =
      ((fun q : List Bool => (List.range n).map fun i =>
        G ((List.range (k + 1)).map fun j => q.getD (i + j) false))^[t] r').getD i false
context: |
  Cone locality of the window rule, the time-space dependency fact of a Cook–Levin tableau. One step of the window
  rule of width k + 1 makes cell i depend on the old cells i, …, i + k, so after t steps cell i depends only on the
  input cells i, …, i + k t. This statement says that two rows of length n that agree on that cone give the same
  cell i after t steps. It is the iterated form of the one-step locality of pnp-209, proved by induction on t, with
  no machine, no polynomial bound, no P, and it does not decide P vs NP. It is the fact that lets a tableau cell at
  time t be computed from a bounded cone of earlier cells, which the pnp-100 route needs at the level of rows.
sketch: |
  Induction on t, generalising r, r' and i. The case t = 0 is the hypothesis at j = i, since the cone is then {i}
  and the iterate is the identity. For t + 1, use Function.iterate_succ_apply to write the iterate as t steps applied
  to one step of r and of r'. Let q and q' be the one-step images. Both have length n (List.length_map and
  List.length_range), so for an index j ≥ n both getD values are false. For j < n, q.getD j is the window rule at j
  applied to r, and the window of j reads r at j, …, j + k, which lies in the cone of i for time t + 1 because
  j ≤ i + k t. So q and q' agree on the cone of i for time t, and the induction hypothesis gives the claim.
