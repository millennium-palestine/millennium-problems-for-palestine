id: pnp-222
problem: pvsnp
title: A witness bit read onto the fan-out stack is conjoined with the top value, and the rest of the witness is kept
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- MPP.PvsNP
- Turing
depends:
- pnp-149
- pnp-219
statement: |
  let step := fun (st : List Bool × List Bool × Option Bool) (c : Bool) =>
    match st.2.2 with
    | none => (st.1, st.2.1, some c)
    | some d =>
      if d then (if c then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
        else (st.1, st.2.1, none))
      else (if c then (st.1.headD false :: st.1, st.2.1, none)
        else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))
  ∀ (x b : Bool) (t w : List Bool),
    [false, false, true, true, false, true, true, true].foldl step ((x :: t), (b :: w), none) =
      (((b && x) :: t), w, none)
context: |
  Witness-leaf gadget of pnp-141. The pair (false, false) reads the first witness bit b and pushes it on the stack
  (pnp-149 style), then the AND gadget of pnp-219 conjoins it with the old top x. So a witness leaf can be combined
  with a computed value in a single gate, and the rest of the witness is left for later leaves. This is the
  witness-input half of the gate basis of pnp-141. It does not decide P vs NP.
sketch: |
  The first four bits push b onto the stack and drop it from the witness, leaving (b :: x :: t) and w. The next six
  bits are the AND gadget of pnp-219 applied to b and x, which gives (b && x) :: t. Split on x and b, then rfl.
