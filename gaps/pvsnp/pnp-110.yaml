id: pnp-110
problem: pvsnp
title: In a pop-bounded TM2 block, cell i of a stack after the block depends only on the old cells up to index b + i
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- Computability
- Turing
depends: []
statement: |
  ∀ (K : Type) [DecidableEq K] (Γ : K → Type) (Λ σ : Type) (q : TM2.Stmt Γ Λ σ) (b : ℕ),
    TM2.Stmt.rec (motive := fun _ => ℕ) (fun _ _ _ ih => ih) (fun _ _ _ ih => ih)
      (fun _ _ _ ih => ih + 1) (fun _ _ ih => ih) (fun _ _ _ ih₁ ih₂ => max ih₁ ih₂) (fun _ => 0) 0 q ≤ b →
    ∀ (v : σ) (S S' : ∀ k, List (Γ k)), (∀ k, (S k).take (b + 1) = (S' k).take (b + 1)) →
      ∀ (k : K) (i : ℕ), (∀ j, j ≤ b + i → (S k)[j]? = (S' k)[j]?) →
        ((TM2.stepAux q v S).stk k)[i]? = ((TM2.stepAux q v S').stk k)[i]?
context: |
  Cell-locality lemma for the Cook–Levin tableau of pnp-100, the step after pnp-109. A stack of a
  TM2 machine is a tape read from the top: cell i is the i-th symbol from the top. pnp-109 says that a
  block with at most b pops per path replaces stack k by a prefix L followed by the old stack with its
  top m symbols removed, with L and m shared by two runs whose top b + 1 symbols agree. Reading cell i
  of the new stack therefore reads either L at i, or the old cell at index m + i - |L|, which is at most
  b + i. So the new cell i depends only on the old cells 0, …, b + i of that stack, together with the
  top-window hypothesis that fixes the control. This is the locality that lets a tableau row be
  computed from a bounded window of the previous row. It is a fact about one block, not about any
  language, and it does not decide P vs NP.
sketch: |
  Apply pnp-109 to the stack k (the top-window hypothesis is the same). It gives L and m ≤ b with
  stepAux stk k = L ++ drop m (S k) and stepAux stk k = L ++ drop m (S' k) for the two runs, so it
  suffices to compare (L ++ drop m T)[i]? for T = S k and T = S' k. If i < |L| both are L[i]. Otherwise
  List.getElem?_append_right gives (drop m T)[i - |L|]? = T[m + (i - |L|)]?, by List.getElem?_drop,
  and m + (i - |L|) ≤ b + i, so the hypothesis at index m + (i - |L|) finishes the case.
