id: pnp-225
problem: pvsnp
title: Setting the witness bit at the unary index given by the instance is polynomial-time
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- MPP.PvsNP
- Turing
depends:
- pnp-006
- pnp-021
- pnp-025
- pnp-026
- pnp-037
- pnp-052
- pnp-093
- pnp-117
- pnp-120
- pnp-126
- pnp-127
- pnp-136
statement: |
  ∃ f : List Bool → List Bool,
    Nonempty (TM2ComputableInPolyTime (id : List Bool → List Bool) (id : List Bool → List Bool) f) ∧
    ∀ x w : List Bool, f (pair x w) = pair x (w.set (x.count true) true)
context: |
  The write side of pnp-134. pnp-134 reads the witness bit at the index given by the number of true
  bits of the instance. A table DP that updates one entry per round needs the matching write: the new
  witness has the same length, with position x.count true set to true, and the instance and separator
  are copied unchanged. List.set leaves the list unchanged when the index is past the end, so the
  statement needs no length hypothesis. This gap is only the write. It does not build a table, does not
  simulate a verifier, and does not decide P vs NP.
sketch: |
  Compose accepted pieces; no new machine is built. Let k be the count of true bits of the instance,
  with the unary mark list 1^k from pnp-093 applied to the decoded instance (pnp-021). Pair the witness
  with the marks (pnp-026) and take and drop by the mark count (pnp-136, pnp-120), so the witness splits
  as w.take k and w.drop k. The rest of the witness is replaced by its head set to true: the list
  (true :: d.tail).take d.length, built from pnp-117, the constant map pnp-126 and concatenation pnp-052.
  Then w.set k true = w.take k ++ (true :: (w.drop k).tail).take (w.drop k).length for every w,
  including k past the end, by induction on w. Concatenate the two parts (pnp-127) and pair the decoded
  instance with the result (pnp-026). Composition is pnp-006. The equation is the one above.
