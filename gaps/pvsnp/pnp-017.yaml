id: pnp-017
problem: pvsnp
title: Under P = NP, NP is closed under complement
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- MPP.PvsNP
depends:
- pnp-002
- pnp-004
statement: |
  PEqualsNP → ∀ L : Lang, InNP L → InNP (fun x => !L x)
context: |
  Conditional statement: it assumes PEqualsNP and does not claim it. Under that
  assumption, an NP language is a P language, its complement is a P language (pnp-004),
  and a P language is in NP (pnp-002). The complement counterpart of pnp-015 and pnp-016.
sketch: |
  Unfold PEqualsNP to get InP L from InNP L. Apply pnp-004 to get InP (fun x => !L x),
  then pnp-002 to conclude InNP of the same language.
dead: []
