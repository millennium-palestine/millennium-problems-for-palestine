id: pnp-182
problem: pvsnp
title: Three wires of the consumption cone of a tagged fan-out run's top wire are consumed from outside the cone
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∃ x : List Bool, ∃ s : List ℕ × ℕ × Option Bool × List (ℕ × ℕ),
    x.foldl (fun (st : List ℕ × ℕ × Option Bool × List (ℕ × ℕ)) (b : Bool) =>
      match st.2.2.1 with
      | none => (st.1, st.2.1, some b, st.2.2.2)
      | some a =>
        if a then (if b then (st.2.1 :: st.1.drop 2, st.2.1 + 1, none,
            ((st.1.take 2).filter (· != 0)).map (fun u => (u, st.2.1)) ++ st.2.2.2)
          else (st.1, st.2.1, none, st.2.2.2))
        else (if b then (st.1.headD 0 :: st.1, st.2.1, none, st.2.2.2)
          else (st.2.1 :: st.1, st.2.1 + 1, none, st.2.2.2))) ([], 1, none, []) = s ∧
    (∃ c : ℕ, 5 < c ∧ (1, c) ∈ s.2.2.2) ∧ (∃ c : ℕ, 5 < c ∧ (3, c) ∈ s.2.2.2) ∧
      (∃ c : ℕ, 5 < c ∧ (5, c) ∈ s.2.2.2) ∧
      Relation.ReflTransGen (fun c a => (a, c) ∈ s.2.2.2) 5 1 ∧
      Relation.ReflTransGen (fun c a => (a, c) ∈ s.2.2.2) 5 3
context: |
  Companion to pnp-181, recording a second dead end for the interval decomposition sketched for pnp-152.
  The exposure bound of that sketch says that, for a wire i, only the wire i and the entry directly below
  it can be consumed by a wire created after i, among the wires of the consumption cone of i. This
  statement refutes it at the top wire 5 of an 18-bit run: the cone of 5 is the interval [1, 5], and the
  wires 1, 3 and 5 of that cone are each consumed by a later wire (7, 6 and 6). The run is the 14-bit run
  of pnp-181 followed by two NAND pairs. It is proved by evaluation, so it adds no P vs NP content.
  The treewidth of the circuit graph of this run is 2, so the refutation rules out the linear interval
  decomposition only, not the treewidth-2 claim of pnp-152.
sketch: |
  Take x to be the 18 bits (F,F) (F,T) (F,F) (T,T) (F,T) (F,F) (T,T) (T,T) (T,T), so that the final stack is
  [7] and the log contains (3, 6), (5, 6), (1, 7), (6, 7) among the arcs of the run. Then 5 reaches 3 and 1
  through the arcs (3, 5) and (1, 3) of the run, and 1, 3 and 5 are consumed at times 7, 6 and 6.
  Each conjunct is an evaluation of the fold or a membership or chain fact on the concrete log.
dead: []
