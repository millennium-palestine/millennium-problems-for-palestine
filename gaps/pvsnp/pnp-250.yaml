id: pnp-250
problem: pvsnp
title: Two tables with explicit up, down and middle conditions that satisfy the interval recurrence agree on every nonempty interval
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (B : ℕ → Bool × Bool → Prop) (U D : ℕ → Prop) (M : ℕ → ℕ → Prop) (P : ℕ → Bool → Bool → Prop) (X Y : ℕ → ℕ → Bool × Bool → Prop),
    (∀ (i : ℕ) (p : Bool × Bool), X i i p ↔ p.1 = p.2) → (∀ (i : ℕ) (p : Bool × Bool), Y i i p ↔ p.1 = p.2) →
    (∀ (i : ℕ) (p : Bool × Bool), X i (i + 1) p ↔ B i p) → (∀ (i : ℕ) (p : Bool × Bool), Y i (i + 1) p ↔ B i p) →
    (∀ (i j : ℕ) (p : Bool × Bool), i + 2 ≤ j → (X i j p ↔
      ((U i ∧ ∃ u : Bool, P i u p.1 ∧ D (j - 1) ∧ M (i + 1) (j - 1) ∧ ∃ g' : Bool, X (i + 1) (j - 1) (u, g') ∧ p.2 = !(g' && p.1)) ∨
       (∃ k : ℕ, i < k ∧ k < j ∧ ∃ g1 : Bool, X i k (p.1, g1) ∧ X k j (g1, p.2))))) →
    (∀ (i j : ℕ) (p : Bool × Bool), i + 2 ≤ j → (Y i j p ↔
      ((U i ∧ ∃ u : Bool, P i u p.1 ∧ D (j - 1) ∧ M (i + 1) (j - 1) ∧ ∃ g' : Bool, Y (i + 1) (j - 1) (u, g') ∧ p.2 = !(g' && p.1)) ∨
       (∃ k : ℕ, i < k ∧ k < j ∧ ∃ g1 : Bool, Y i k (p.1, g1) ∧ Y k j (g1, p.2))))) →
    ∀ (i j : ℕ) (p : Bool × Bool), i < j → (X i j p ↔ Y i j p)
context: |
  The variant of pnp-249 that the pnp-152 table needs. Pnp-249 gives the primitive block an up step at i (U i)
  and a down step at j - 1 (D (j - 1)). A primitive block also needs its middle, the interval (i + 1, j - 1),
  to be a nonnegative zero-sum list of pairs. That is the condition that separates the primitive clause of
  pnp-213 from a split that happens to start and end with an up and a down step. Without it, the recurrence
  of pnp-249 is not the recurrence of the balanced-block relation on every interval, so the instantiation
  would have to be guarded by this condition. This gap adds the middle condition as a predicate M on the
  interval (i + 1, j - 1), carried in the primitive disjunct of both tables. The statement says that two
  tables obeying the same recurrence with these conditions agree on every nonempty interval. The proof is the
  proof of pnp-249 with one more conjunct carried along. It is a fact about functions on the naturals and Bool
  pairs: no machine, no polynomial bound, no P, and it does not decide P vs NP. Instantiating M, U and D with
  the balance conditions of a pair list is a separate step.
sketch: |
  Let key n be the claim for all intervals of length n, proved by strong induction on n. If j = i + 1, both
  sides are B i p by the base hypotheses. Otherwise i + 2 ≤ j and both recurrences rewrite the left and right
  sides. In the primitive disjunct, U i, D (j - 1) and M (i + 1) (j - 1) are the same on both sides, and the
  middle interval (i + 1, j - 1) is either empty, where both tables give u = g' by the empty axiom, or nonempty
  and shorter, where the induction hypothesis applies. The split disjunct uses the two shorter intervals
  (i, k) and (k, j), as in pnp-248. Both directions of each disjunction are matched term by term.
