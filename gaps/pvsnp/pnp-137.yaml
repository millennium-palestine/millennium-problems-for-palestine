id: pnp-137
problem: pvsnp
title: Sliding windows of a variable width read from the second component are polynomial-time
status: open
imports:
- Mathlib
- MPP.Defs.PvsNP
open:
- MPP.PvsNP
- Turing
depends:
- pnp-136
statement: |
  ∀ g : Lang, InP g → ∃ F : List Bool → List Bool,
    Nonempty (TM2ComputableInPolyTime (id : List Bool → List Bool) (id : List Bool → List Bool) F) ∧
    ∀ x u : List Bool, F (pair x u) = List.ofFn (fun i : Fin (x.length + 1 - (u.length + 1)) =>
      g ((x.drop (i : ℕ)).take (u.length + 1)))
context: |
  Variable-width form of pnp-115, the window map used by the Cook–Levin tableau of pnp-100. pnp-115
  fixes the window width k + 1 in the statement. A tableau laid out row by row has rows of the length
  of the input, so the window must be as wide as a row, and its width is then the length of a
  second component. This gap says that the list of all windows of that width, each with its
  predicate bit, is still polynomial-time computable from the pair encoding. It is the window map
  of pnp-115 with the fixed take replaced by the take of pnp-136. It does not decide P vs NP, and
  it does not by itself give the hardness half of pnp-100.
sketch: |
  Input is pair x u, with the width u.length + 1. Use the iteration as in pnp-115: a one-bit
  extension step z ↦ z ++ [g (window at position |z|)], iterated as many times as there are windows,
  where the window at position |z| is the take of pnp-136 applied to the drop of x, with the
  second component the unary string of the width. The count of windows is x.length + 1 - (u.length + 1),
  which is read from the unary length of x by the same loop as in pnp-115. Compose with pnp-008
  and pnp-060 for the predicate, and with pnp-066 for the iteration. The equation follows from
  the step equation by induction on the count.
dead: []
