id: pnp-272
problem: pvsnp
title: Appending one bit to a run of pairs leaves the top of the fold unchanged
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (q : List (Bool × Bool)) (c v : Bool) (t w : List Bool),
    (((q.flatMap fun r : Bool × Bool => [r.1, r.2]) ++ [c]).foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
        match st.2.2 with
        | none => (st.1, st.2.1, some b)
        | some a =>
          if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
            else (st.1, st.2.1, none))
          else (if b then (st.1.headD false :: st.1, st.2.1, none)
            else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) (v :: t, w, none)).1.headD false =
    ((q.flatMap fun r : Bool × Bool => [r.1, r.2]).foldl (fun (st : List Bool × List Bool × Option Bool) (b : Bool) =>
        match st.2.2 with
        | none => (st.1, st.2.1, some b)
        | some a =>
          if a then (if b then ((!(st.1.headD false && (st.1.drop 1).headD false)) :: st.1.drop 2, st.2.1, none)
            else (st.1, st.2.1, none))
          else (if b then (st.1.headD false :: st.1, st.2.1, none)
            else (st.2.1.headD false :: st.1, st.2.1.drop 1, none))) (v :: t, w, none)).1.headD false
context: |
  Step toward pnp-152, used after pnp-271. The fold of pnp-133 reads bits in pairs: a bit when the pending slot is
  empty, and a second bit that consumes the pending one. A flattened list of pairs therefore leaves the pending slot
  empty, and a single leftover bit only fills that slot without touching the stack. So a leftover bit at the end of
  a run does not change the top, which is what the bit-level fold of pnp-152 needs when the input has odd length.
  It is a fact about the fold alone: no machine, no polynomial bound, no P, and it does not decide P vs NP.
sketch: |
  Let key say that a fold over the flattened pairs keeps the pending slot empty when it starts empty; induct on the
  list of pairs. One pair is two bits: the first sets the pending slot, the second clears it in every branch of the
  match, so the induction hypothesis applies to the state after the pair. Then the appended bit, folded from a state
  with an empty pending slot, only sets the slot, and the first component (the stack) is unchanged, so the top agrees.
