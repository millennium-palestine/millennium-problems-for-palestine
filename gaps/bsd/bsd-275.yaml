id: bsd-275
problem: bsd
title: 'Five-torsion converse: a nonsingular affine point (x, y) with 2y + a₁x + a₃ ≠ 0, Ψ₃(x) ≠ 0 and ψ₅(x) = 0 satisfies 5 • P = 0'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-217
- bsd-268
- bsd-271
statement: |
  ∀ (K : Type) [Field K] [DecidableEq K] (W : WeierstrassCurve K) (x y : K) (h : W.toAffine.Nonsingular x y),
    2 * y + W.a₁ * x + W.a₃ ≠ 0 →
    3 * x ^ 4 + W.b₂ * x ^ 3 + 3 * W.b₄ * x ^ 2 + 3 * W.b₆ * x + W.b₈ ≠ 0 →
    (W.preΨ' 5).eval x = 0 →
    (5 : ℤ) • (WeierstrassCurve.Affine.Point.some x y h : W.toAffine.Point) = 0
context: |
  The converse of bsd-246 (the five-torsion points have roots of ψ₅ as x-coordinates) in the case that the point is
  not 2-torsion and not 3-torsion. It is the ℓ = 5 step of the lower bound bsd-193: each root x0 of ψ₅ = preΨ' 5 lifts
  to a point P with 5P = 0 (bsd-243 gives the lift, and this gap gives 5P = 0 for the lift). The argument is the
  identity x(3P) − x(2P) = −ψ₅ · (unit) / (Ψ₂Sq · Ψ₃²) on the curve: with g = Ψ₂Sq and Ψ₃ as in bsd-268, the two
  coordinates are x(2P) = x − Ψ₃/g and x(3P) = x − preΨ₄ g/Ψ₃², and their difference is −(preΨ₄ g² − Ψ₃³)/(g Ψ₃²),
  where preΨ₄ g² − Ψ₃³ = preΨ' 5 by preΨ'_odd at m = 0. So ψ₅(x) = 0 forces x(2P) = x(3P), and bsd-217 then gives
  3P = ±2P; the sign 3P = 2P forces P = 0, so 3P = −2P and 5P = 0. The hypothesis Ψ₃(x) ≠ 0 rules out 3P = 0 (which
  would force 2P = −P and x(2P) = x, hence Ψ₃(x) = 0). Not checked against the text here.
sketch: |
  (1) D = 2y + a₁x + a₃ ≠ 0 gives 2P = some x₂ y₂ by Mathlib's add_self_of_Y_ne, and bsd-268 gives (x − x₂) g = Ψ₃(x).
  (2) If 3P = 0 then P + (P + P) = 0, so 2P = −P, so x₂ = x, so Ψ₃(x) = 0: excluded. Hence 3P = some t y₃ (add_eq_zero_iff_eq_neg,
  then Point.some case split), and bsd-271 gives t Ψ₃² = x Ψ₃² − preΨ₄ g.
  (3) Clear denominators: t = x₂ follows from (x − x₂) g = Ψ₃ and t Ψ₃² = x Ψ₃² − preΨ₄ g together with the
  polynomial identity preΨ₄ g² − Ψ₃³ = preΨ' 5 (Mathlib preΨ'_odd 0, preΨ'_four, preΨ'_two, preΨ'_three).
  (4) bsd-217 applied to 3P and 2P (same x-coordinate) gives 3P = 2P or 3P = −2P. The first gives P = 0 (contradiction
  with P affine), so 3P = −2P and 5P = 0 (add_zsmul, zsmul_neg, add_neg_cancel).
  Mathlib: Point.add_self_of_Y_ne, Point.some_ne_zero, linear_combination for step (3), mul_right_cancel₀.
