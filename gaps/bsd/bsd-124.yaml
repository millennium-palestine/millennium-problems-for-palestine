id: bsd-124
problem: bsd
title: 'Weak Mordell–Weil for the split short form with integer roots: for y² = x³ + px + q over ℚ whose cubic has three distinct integer roots e1, e2, e3 of sum zero, E(ℚ) modulo twice itself is finite'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-056
- bsd-107
- bsd-113
- bsd-123
statement: |
  ∀ (e1 e2 e3 : ℤ) (E : WeierstrassCurve ℚ) [E.IsElliptic], e1 + e2 + e3 = 0 → e1 ≠ e2 → e1 ≠ e3 → e2 ≠ e3 →
    E.a₁ = 0 → E.a₂ = 0 → E.a₃ = 0 →
    E.a₄ = (e1 : ℚ) * (e2 : ℚ) + (e1 : ℚ) * (e3 : ℚ) + (e2 : ℚ) * (e3 : ℚ) →
    E.a₆ = -((e1 : ℚ) * (e2 : ℚ) * (e3 : ℚ)) →
    ∃ s : Finset E.toAffine.Point, ∀ P : E.toAffine.Point, ∃ Q ∈ s, ∃ R : E.toAffine.Point, P = Q + 2 • R
context: |
  The split case with integer roots of the weak Mordell–Weil theorem bsd-036, the analogue of bsd-118 (one-root) and
  bsd-103 (irreducible). The Kummer data are the two maps of bsd-123, one for the root e1 and one for the root e2 (the
  same lemma with the roots permuted). Their product is a homomorphism E(ℚ) → (ℚˣ/squares)², with values in a finite
  set because bsd-107 gives a finite set of representatives for x − e1 and for x − e2 (integer roots). Its fibres differ
  by twice the group plus a finite defect set: the points with y = 0 (the three 2-torsion points, finitely many) and O.
  The kernel statement for a point with y ≠ 0 uses bsd-056: if x − e1 and x − e2 are squares, then so is x − e3,
  because (x − e1)(x − e2)(x − e3) = y² is a square, and then bsd-056 gives the point as twice a rational point. The
  finite-set version of the fibre argument is bsd-113. This gap is only the split integer case; the rational split case
  reduces to it by a rational change of variables (a separate gap).
sketch: |
  Let κ1 and κ2 be the Kummer homomorphisms of bsd-123 for the roots (e1, e2, e3) and (e2, e1, e3), and κ = κ1.prod κ2,
  an AddMonoidHom into the product of two copies of Additive(ℚˣ/squares) (AddMonoidHom.prod). (a) Finite image: for an
  affine point with x ≠ e1, bsd-107 gives x − e1 = d·u² with d in a finite set D1 ⊆ ℤ, so κ1(P) is the class of one of the
  finitely many nonzero d in D1, or the class of (e1 − e2)(e1 − e3) at x = e1, or 0 at O; the same for κ2. Take s as the
  product of these two finite sets. (b) Fibres: if κ(P) = κ(Q), set S = P − Q. Then κ(S) = 0. If S = O, use d = O. If
  y(S) = 0, S is one of finitely many points (x(S) is a root and the curve equation gives x(S) ∈ {e1, e2, e3}), and
  d = S with R = 0. If y(S) ≠ 0, both classes trivial give x − e1 and x − e2 squares, hence x − e3 is a square as above,
  and bsd-056 gives S = R + R, so take d = O. (c) Conclude with bsd-113 applied to κ, the finite set s, and the finite
  defect set D = {O} ∪ {points with y = 0}.
