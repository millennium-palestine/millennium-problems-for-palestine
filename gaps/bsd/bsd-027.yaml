id: bsd-027
problem: bsd
title: 'Mordell descent, abstract form: a height with finite bounded sets and finite index in 2G makes G finitely generated'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (G : Type) [AddCommGroup G] (h : G → ℝ) (C : ℝ),
    (∀ P : G, 0 ≤ h P) → (∀ P : G, h (-P) = h P) →
    (∀ P Q : G, h (P + Q) ≤ 2 * h P + 2 * h Q) →
    (∀ P : G, 4 * h P - C ≤ h (2 • P)) →
    (∀ M : ℝ, {P : G | h P ≤ M}.Finite) →
    (∃ s : Finset G, ∀ P : G, ∃ Q ∈ s, ∃ R : G, P = Q + 2 • R) →
    AddGroup.FG G
context: |
  The abstract core of Mordell's theorem (Silverman, AEC, Ch. VIII, Thm 3.1; Cassels 1966). It contains no
  elliptic curve: G is any abelian group, h is a height, and the hypotheses are the three properties the
  curve-specific gaps must supply. The last hypothesis is the weak Mordell–Weil input: every element is a
  representative Q from a finite set s plus twice some R (so G/2G is finite). The height inequalities are the
  parallelogram-type bound h(P+Q) ≤ 2h(P) + 2h(Q) and the doubling bound h(2P) ≥ 4h(P) − C. Finiteness of
  bounded-height sets is the Northcott property. Splitting Mordell into this lemma, the weak Mordell–Weil
  statement for E(ℚ) (bsd-002's first half) and the canonical height on E(ℚ) gives three independent pieces.
  Keep the lemma in this exact form: it is a theorem about every abelian group, not about curves.
sketch: |
  Let F be the finite set {P | h P ≤ N} with N = 2D + 2 for a constant D depending on s and C (take D = (M₀ + |C|)/2
  where M₀ bounds h on s). Take T = AddSubgroup.closure (s ∪ F). Show by strong induction on a natural number n
  that h P ≤ n implies P ∈ T. If h P ≤ N, P ∈ F. Otherwise write P = Q + 2R with Q ∈ s. Then 2R = P + (−Q), so
  h(2R) ≤ 2h(P) + 2h(Q) and h R ≤ (h(2R) + C)/4 ≤ h(P)/2 + D ≤ n − 1, so R ∈ T by induction, and P ∈ T.
  Finally T is generated by the finite set s ∪ F, so G = T is finitely generated.
