id: bsd-388
problem: bsd
title: 'Euclid step 3 of the bsd-361 resultant chain: lc(B)^2 A = Q B + g S over any field, with explicit polynomials A, B, S of formal degrees 7, 6 and 5'
status: open
imports:
- Mathlib
open:
- Polynomial
depends: []
statement: |
  ∀ (K : Type) [Field K] (a b : K) (A B : K[X]),
      A = (C (-102022456 * a ^ 4 + 89943750 * a * b ^ 2) * X ^ 7
        + C (-818301300 * a ^ 3 * b - 512679375 * b ^ 3) * X ^ 6
        + C (-105514520 * a ^ 5 - 2552335650 * a ^ 2 * b ^ 2) * X ^ 5
        + C (-588416420 * a ^ 4 * b - 6343801875 * a * b ^ 3) * X ^ 4
        + C (-39707176 * a ^ 6 - 701606478 * a ^ 3 * b ^ 2 - 5426514000 * b ^ 4) * X ^ 3
        + C (-292063196 * a ^ 5 * b - 1474633485 * a ^ 2 * b ^ 3) * X ^ 2
        + C (-2739464 * a ^ 7 - 546176662 * a ^ 4 * b ^ 2 - 3079452600 * a * b ^ 4) * X
        + C (2564148 * a ^ 6 * b - 201904881 * a ^ 3 * b ^ 3 - 1293529500 * b ^ 5)) →
      B = (C (-17803094800 * a ^ 6 - 62043251400 * a ^ 3 * b ^ 2 - 15785128125 * b ^ 4) * X ^ 6
        + C (-77117220288 * a ^ 5 * b - 112757346000 * a ^ 2 * b ^ 3) * X ^ 5
        + C (-12187440464 * a ^ 7 - 266306742792 * a ^ 4 * b ^ 2 - 224634515625 * a * b ^ 4) * X ^ 4
        + C (-13976339840 * a ^ 6 * b - 269048930400 * a ^ 3 * b ^ 3 - 167079510000 * b ^ 5) * X ^ 3
        + C (-7238199088 * a ^ 8 - 58221799704 * a ^ 5 * b ^ 2 - 61392716775 * a ^ 2 * b ^ 4) * X ^ 2
        + C (-17069694656 * a ^ 7 * b - 145620304848 * a ^ 4 * b ^ 3 - 101801934000 * a * b ^ 5) * X
        + C (183765136 * a ^ 9 - 6154081240 * a ^ 6 * b ^ 2 - 63431895555 * a ^ 3 * b ^ 4 - 39827092500 * b ^ 6)) →
      ∃ Q S : K[X], Q.natDegree ≤ 1 ∧ S.natDegree ≤ 5 ∧
        C (625*(712123792*a ^ 6 + 2481730056*a ^ 3*b ^ 2 + 631405125*b ^ 4) ^ 2) * A = Q * B + C (48*a ^ 2*(51011228*a ^ 3 - 44971875*b ^ 2) ^ 2) * S
context: |
  Step 3 of the Euclid chain for bsd-361 (after bsd-385, which gives the first remainder). Here A and B are the two previous remainders, with formal degrees 7 and 6, and S is the primitive part of the pseudo-remainder of A by B: lc(B)^2 A = Q B + g S, where lc(B) is the leading coefficient of B in X and g ∈ ℤ[a, b] is the content of the pseudo-remainder (the gcd of its coefficients). Degree of Q is at most 1, and S has degree at most 5. The identity was checked by exact expansion over ℤ[a, b][X] (sympy). It is a ring identity, so it holds over every field. It is stated with A, B, S as explicit polynomials so that the statement elaborates within the checker's default heartbeat limit; Q is only in the proof.
sketch: |
  Substitute A, B, S (subst). Give the explicit quotient Q, prove the two degree bounds by compute_degree!, and prove the identity by simp only [map_pow, map_mul, map_add, map_sub, map_neg, map_ofNat, map_natCast, Nat.cast_ofNat] then ring. Proofs may set maxHeartbeats for the proof of main.
