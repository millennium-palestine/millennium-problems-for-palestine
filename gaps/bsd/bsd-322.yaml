id: bsd-322
problem: bsd
title: 'Certificate for the n = 5 elliptic-net relation: a sequence satisfying the n = 2, 3, 4 relations near 0 makes X(−4) X(−3) times the n = 5 bracket at 0 vanish'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (A : Type) [CommRing A] (b c d : A) (X : ℤ → A),
    (∀ j : ℤ, -4 ≤ j → j ≤ 4 →
      X (j + 2) * X (j - 2) - b ^ 2 * X (j + 1) * X (j - 1) + c * X j ^ 2 = 0) →
    (∀ j : ℤ, -3 ≤ j → j ≤ 3 →
      X (j + 3) * X (j - 3) - c ^ 2 * X (j + 1) * X (j - 1) + d * b * b * X j ^ 2 = 0) →
    (∀ j : ℤ, -2 ≤ j → j ≤ 2 →
      X (j + 4) * X (j - 4) - (d * b) ^ 2 * X (j + 1) * X (j - 1)
        + (d * b ^ 4 - c ^ 3) * c * X j ^ 2 = 0) →
    X (-4) * X (-3) * (X 5 * X (-5) - (d * b ^ 4 - c ^ 3) ^ 2 * X 1 * X (-1)
      + b * b * c * d * ((d * b ^ 4 - c ^ 3) - d ^ 2) * X 0 ^ 2) = 0
context: |
  The algebraic core of bsd-320 (the n = 5 case of the elliptic-net relation for normEDS). The n = 5 bracket at
  index 0 is X(5) X(−5) − N(5)² X(1) X(−1) + N(6) N(4) X(0)², with N(4) = d b, N(5) = d b⁴ − c³ and
  N(6) N(4) = b² c d (N(5) − d²). The statement says that this bracket, multiplied by the two atoms X(−4) and
  X(−3), lies in the ideal generated by the n = 2, 3, 4 relations at the indices in the windows stated. It does
  not say the bracket itself vanishes: multiplying by X(−4) X(−3) is what makes the certificate polynomial.
  For normEDS the two atoms are N(m−4) and N(m−3), which are nonzero for m outside {3, 4} by the nonvanishing
  gaps (bsd-225, bsd-227, bsd-228), so the n = 5 relation follows for those m once this is known.
  Checked: an exact certificate with 24 terms, coefficients in Z[b, c, d], was found by a weight-graded linear
  algebra search (weights w(b) = 3, w(c) = 8, w(d) = 12, w(X_k) = k² − 1 in doubled units, which make every
  relation homogeneous) and verified symbolically with sympy (difference expands to zero). Not checked in Lean.
sketch: |
  Direct linear_combination: specialise the three hypotheses at the indices j needed (the eight relations used are
  the n = 2 relations at j = −4, −3, −2, −1, 0, the n = 3 relations at j = −3, −2, −1, and the n = 4 relation at
  j = 1), then close with linear_combination over the 24 terms. Each term is a coefficient in b, c, d times a
  monomial of degree 2 in the atoms X(k), |k| ≤ 5, times one specialised relation. Write the coefficients in the
  form b ^ x * c ^ y * d ^ z with exponents, and let linear_combination check the identity by ring.
