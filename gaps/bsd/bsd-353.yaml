id: bsd-353
problem: bsd
title: 'Two-torsion count: over a field with 2 invertible, an elliptic curve has at most four points P with 2 • P = 0, the zero point included'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] [DecidableEq K] (W : WeierstrassCurve K), (2 : K) ≠ 0 →
    Nat.card {P : W.toAffine.Point // 2 • P = 0} ≤ 4
context: |
  Two-torsion part of the m-torsion upper bound (bsd-192) for even m: for even m with (m : K) nonzero, the
  two-torsion is contained in the m-torsion, and the bound m^2 needs the count 4 for the two-torsion (zero plus
  at most three affine points). Here the hypothesis 2 ≠ 0 in K is the one the cubic below needs. The affine points
  with 2 • P = 0 are the ones with 2y + a1 x + a3 = 0, so the y-coordinate is determined by the x-coordinate
  (the fibre over x has at most one point), and the x-coordinates are roots of the cubic
  4 x^3 + b2 x^2 + 2 b4 x + b6, which is (2y + a1 x + a3)^2 modulo the curve equation. The cubic has leading
  coefficient 4 ≠ 0, so it has at most three roots. Not checked in Lean.
sketch: |
  (1) For an affine point (x, y) with 2 • P = 0, P = -P, so 2y + a1 x + a3 = 0 (WeierstrassCurve.Affine.Point.neg_some,
  or the add_self_of_Y_eq lemma). (2) From the curve equation, 4 x^3 + b2 x^2 + 2 b4 x + b6 = (2y + a1 x + a3)^2 =
  0, by linear_combination with the equation (W.toAffine.equation_iff). (3) Two affine two-torsion points with the
  same x have the same y, hence are equal (proof irrelevance in Point.some). (4) The x-coordinates of the nonzero
  two-torsion points form a finite set of roots of the cubic, of cardinality at most 3 (Polynomial.card_roots' with
  natDegree at most 3, or Finset.card_le_card on roots.toFinset). (5) Nat.card of the subtype is at most 1 + 3.
  Mathlib: WeierstrassCurve.Affine.Point, Nat.card_eq_fintype_card, Finset.card_le_card_of_injOn, Polynomial.card_roots'.
