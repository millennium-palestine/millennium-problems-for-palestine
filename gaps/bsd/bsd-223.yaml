id: bsd-223
problem: bsd
title: 'Elliptic-net instance at n = 3: ψ(m+3) ψ(m−3) = ψ(m+1) ψ(m−1) ψ(3)² − ψ(4) ψ(2) ψ(m)², for the division polynomials of a Weierstrass curve'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) (m : ℤ),
    W.ψ (m + 3) * W.ψ (m - 3) =
      W.ψ (m + 1) * W.ψ (m - 1) * W.ψ 3 ^ 2 - W.ψ 4 * W.ψ 2 * W.ψ m ^ 2
context: |
  The n = 3 instance of the elliptic-net addition formula ψ_{m+n} ψ_{m−n} = ψ_{m+1} ψ_{m−1} ψ_n² − ψ_{n+1} ψ_{n−1} ψ_m²
  (bsd-210, open). It is the one case of bsd-210 that bsd-222 needs. The n = 1 case is trivial and the n = 2 case
  is bsd-214 (on main). This gap is a split of bsd-210 into its first nontrivial instance, stated with the
  division polynomials W.ψ of Mathlib (WeierstrassCurve.ψ, with ψ_even and ψ_odd in
  AlgebraicGeometry/EllipticCurve/DivisionPolynomial/Basic.lean), so that it elaborates on its own.
  It is true: it is the standard addition formula for division polynomials (Silverman, Exercise 3.7, and
  Stange, Elliptic nets and elliptic curves). Checked numerically, not in Lean: with the short model
  y² = x³ + 2x + 3 at the rational point (3, 6), using the recurrences ψ_{2m+1} = ψ_{m+2} ψ_m³ − ψ_{m−1} ψ_{m+1}³
  and ψ_{2m} ψ_2 = ψ_m (ψ_{m+2} ψ_{m−1}² − ψ_{m−2} ψ_{m+1}²), the difference is zero for m in [−3, 3].
  Relation to bsd-222: multiplying this instance by ψ_{m+1} ψ_{m−1} and eliminating ψ(m±3) with the n = 2
  instances at m ± 1 (bsd-214) gives ψ_m ψ_2 times the bsd-222 bracket. So bsd-222 follows from this gap
  only after cancelling the factor ψ_m ψ_2, which is not a ring identity: the cancellation needs ψ_m ≠ 0
  and ψ_2 ≠ 0, so the degenerate cases must be handled separately.
  Negative finding on the window-only route (sympy, grevlex, not a proof): writing the bsd-222 bracket in
  the level-k symbols A_i = ψ(k+i) after the parity reduction with ψ_even and ψ_odd, the numerator is not in
  the ideal generated by the n = 2 relations at levels k−1, …, k+1 or k−2, …, k+2. So some relation beyond
  bsd-214 at a single level is needed.
sketch: |
  Route A (parity split, as for bsd-222): case m = 2k and m = 2k+1, unfold ψ(m±3) and ψ(m±2), ψ(m±1), ψ(m)
  with ψ_even and ψ_odd (the even formula has a factor ψ₂ on the left, so clear it with ring after
  multiplying by ψ₂). Close by linear_combination with bsd-214 instances if the level-k identity needs them.
  Route B (induction on the cases of the elliptic net): prove the n = 3 instance by using the n = 1 and n = 2
  instances at shifted arguments, then check which half-index terms cancel. Not claimed here.
dead:
- Pure window identities in ψ(m−2..m+2) with only the bsd-214 relations: not enough (see context).
