id: bsd-213
problem: bsd
title: 'Frobenius commutes with the sum y-coordinate formula: over a field K of characteristic p, with a₁, a₂, a₃ fixed by the p-th power, the y-coordinate of a chord sum is commuted with the p-th power'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (p : ℕ) [Fact p.Prime] (K : Type) [Field K] [CharP K p] (W : WeierstrassCurve K),
    W.a₁ ^ p = W.a₁ → W.a₂ ^ p = W.a₂ → W.a₃ ^ p = W.a₃ →
    ∀ x₁ x₂ y₁ ℓ : K,
      WeierstrassCurve.Affine.addY W (x₁ ^ p) (x₂ ^ p) (y₁ ^ p) (ℓ ^ p) =
        (WeierstrassCurve.Affine.addY W x₁ x₂ y₁ ℓ) ^ p
context: |
  Third step of the sketch of bsd-089, the Frobenius as a group endomorphism of the points of E over the algebraic
  closure of F_p. Mathlib's WeierstrassCurve.Affine.addY W x₁ x₂ y₁ ℓ is the y-coordinate of the sum of two points
  whose chord has slope ℓ, built as negY of (addX, negAddY), where negY x y = −y − a₁x − a₃. Its p-th power commutes
  with the p-th power of each input when a₁, a₂, a₃ are fixed by the p-th power. Together with bsd-211 and bsd-212 this
  gives the coordinate formulas that a Frobenius group homomorphism on the points needs. It does not prove that the
  Frobenius is a homomorphism on points, and it does not prove Hasse's bound. It is true for every field of
  characteristic p.
sketch: |
  Unfold addY, negAddY and negY. Use bsd-212 (or the same rewriting) for the inner addX, then add_pow_char,
  sub_pow_char, mul_pow and the coefficient hypotheses to pass the p-th power through −y − a₁x − a₃ and through
  ℓ(addX − x₁) + y₁. A `simp` with these lemmas and the hypotheses, followed by `ring`, should close the goal. Checked
  by hand, not in Lean.
dead: []
