id: bsd-129
problem: bsd
title: 'Weak Mordell–Weil for every short form over ℚ: for every elliptic curve y² = x³ + px + q over ℚ, E(ℚ) modulo twice itself is finite'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-103
- bsd-118
- bsd-127
- bsd-128
statement: |
  ∀ (p q : ℚ) (E : WeierstrassCurve ℚ) [E.IsElliptic], E.a₁ = 0 → E.a₂ = 0 → E.a₃ = 0 →
    E.a₄ = p → E.a₆ = q →
    ∃ s : Finset E.toAffine.Point, ∀ P : E.toAffine.Point, ∃ Q ∈ s, ∃ R : E.toAffine.Point, P = Q + 2 • R
context: |
  The short-form case analysis for the weak Mordell–Weil theorem bsd-036. If the cubic x³ + px + q is irreducible over ℚ,
  this is bsd-103. Otherwise it has a rational root e, and the quadratic cofactor g = X² + eX + (e² + p) is either
  irreducible, which is bsd-118 (the one-root case), or reducible, with roots e2 and −e − e2. Then the three roots e, e2,
  −e − e2 sum to zero, and the discriminant (bsd-127) makes them distinct, so bsd-128 (the rational split case) applies.
  Together with the reduction to short form (bsd-079), this gives bsd-036.
sketch: |
  (a) If X³ + pX + q is irreducible, use bsd-103. (b) Otherwise it has a root e in ℚ (the roots multiset is nonzero,
  Polynomial.irreducible_iff_roots_eq_zero_of_degree_le_three), and X³ + pX + q = (X − e)(X² + eX + (e² + p)) since
  e³ + pe + q = 0. (c) If the quadratic cofactor is irreducible, use bsd-118. (d) Otherwise it has a root e2 in ℚ,
  so e2² + e e2 + (e² + p) = 0. Put e3 = −e − e2; then e + e2 + e3 = 0, p = e e2 + e e3 + e2 e3 and q = −e e2 e3 are
  linear consequences of the two root equations, and bsd-127 gives distinct roots, so bsd-128 applies.
