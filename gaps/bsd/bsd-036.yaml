id: bsd-036
problem: bsd
title: 'Weak Mordell–Weil: on any elliptic curve over ℚ, E(ℚ) modulo twice itself is finite'
status: open
imports:
- Mathlib
- MPP.Defs.BSD
open:
- MPP.BSD
depends: []
statement: |
  ∀ (E : WeierstrassCurve ℚ) [E.IsElliptic], ∃ s : Finset E.toAffine.Point,
    ∀ P : E.toAffine.Point, ∃ Q ∈ s, ∃ R : E.toAffine.Point, P = Q + 2 • R
context: |
  The first half of Mordell's theorem for bsd-002 (Mordell 1922; Silverman, The Arithmetic of Elliptic
  Curves, the chapter on descent). This is the last hypothesis of bsd-027: the quotient E(ℚ)/2E(ℚ) is
  finite. The standard proof is the Kummer map of 2-descent: for E : y² = f(x) with f a monic cubic
  over ℚ, the map sending a point to the class of x − θ in L*/L*² (L = ℚ[T]/(f(T)), θ the class of T)
  is a homomorphism whose kernel is 2E(ℚ), and its image lies in a finite group because only finitely
  many square classes of L are unramified outside the primes dividing the discriminant. It is the hard
  part of bsd-002; a split into the Kummer map and the finiteness of its image is welcome.
sketch: |
  Put E in the form y² = f(x) (complete the square, the curve is isomorphic to such a form over ℚ).
  Define the Kummer map κ : E(ℚ) → (L*/L*²) × ℚ*/ℚ*² on the affine points, with the usual value at
  the points where x − θ vanishes. Show κ is a homomorphism with kernel 2E(ℚ), so E(ℚ)/2E(ℚ) injects
  into the image of κ. Show the image is finite by bounding the valuations of the square classes at the
  primes dividing the discriminant. Choose s as one point P_c in each nonempty
  fibre κ⁻¹(c), c in the finite image. For any P, κ(P) = κ(P_c) for some c, so P − P_c lies in
  ker κ = 2E(ℚ), which gives P = P_c + 2R.
