id: bsd-239
problem: bsd
title: 'Separability of the 3-division polynomial: over a field where 3 is nonzero, a double root x of the 3-division polynomial forces the discriminant form b2³b6 − b2²b4² − 36b2b4b6 + 32b4³ + 108b6² to vanish'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] (b2 b4 b6 x : K), (3 : K) ≠ 0 →
    12 * x ^ 4 + 4 * b2 * x ^ 3 + 12 * b4 * x ^ 2 + 12 * b6 * x + (b2 * b6 - b4 ^ 2) = 0 →
    48 * x ^ 3 + 12 * b2 * x ^ 2 + 24 * b4 * x + 12 * b6 = 0 →
    b2 ^ 3 * b6 - b2 ^ 2 * b4 ^ 2 - 36 * b2 * b4 * b6 + 32 * b4 ^ 3 + 108 * b6 ^ 2 = 0
context: |
  The case ℓ = 3 of the separability input for the torsion lower bound bsd-193. For an elliptic curve with
  b-invariants b2, b4, b6 (and b8 = (b2 b6 − b4²)/4), the 3-division polynomial is ψ₃ = 3x⁴ + b2x³ + 3b4x² + 3b6x + b8,
  and its discriminant with respect to x is −81Δ² (with Δ the curve discriminant, Δ = −Q/4 for Q the form in the
  statement). So a repeated root of ψ₃ can only occur when Δ = 0 (the curve is singular), or when 3 = 0 in the field.
  The gap is stated in the scaled, division-free form: P₄ = 4ψ₃ and D₄ = 4ψ₃′. The polynomial identity behind it,
  verified exactly by sympy, is 3Q = b₁·D₄ − 3·a₁·P₄ with a₁ = −b₂² + 8b₂x + 32b₄ + 48x² and
  b₁ = −b₂²x − b₂b₄ + 9b₂x² + 42b₄x + 27b₆ + 36x³. It needs only 3 ≠ 0 and gives ℓ = 3 separability; the general ℓ
  case has no such certificate in an hour (its discriminant is not a pure power of Δ in general).
sketch: |
  Let P4, D4 be the two hypotheses' left sides. Then 3·Q = b1·D4 − 3·a1·P4 as a polynomial identity in x, b2, b4, b6,
  so linear_combination with coefficients b1 (for D4 = 0) and −3·a1 (for P4 = 0) proves 3·Q = 0. Since 3 ≠ 0, Q = 0
  (mul_eq_zero). Mathlib: linear_combination, mul_eq_zero, resolve_left.
