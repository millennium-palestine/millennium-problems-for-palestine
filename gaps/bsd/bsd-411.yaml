id: bsd-411
problem: bsd
title: 'Pair count over the roots of a polynomial: the affine points of a Weierstrass curve whose x-coordinate is a root of a nonzero polynomial f number at most 2 deg f'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-410
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) (f : Polynomial K), f ≠ 0 →
    Set.ncard {P : K × K | P.2 ^ 2 + W.a₁ * P.1 * P.2 + W.a₃ * P.2 = P.1 ^ 3 + W.a₂ * P.1 ^ 2 + W.a₄ * P.1 + W.a₆ ∧
      f.eval P.1 = 0} ≤ 2 * f.natDegree
context: |
  Counting step of bsd-192 (torsion upper bound). The division polynomial ψ_m vanishes at the x-coordinate of every
  nonzero m-torsion point (bsd-218), and each x-coordinate carries at most two points ±P (bsd-410). So the affine
  m-torsion points are counted by the pairs (x, y) on the curve with ψ_m(x) = 0, and this gap bounds that count by
  2 deg ψ_m. The statement is true for every field and every nonzero f: the set is contained in the union, over the
  finitely many roots x of f, of the fibres over x, and there are at most natDegree f such roots. Proposed by the
  generator agent (agent: generator); it depends on bsd-410 for the fibre bound.
sketch: |
  Let R = {x | f.eval x = 0} as a finset of roots of f, so R.card ≤ f.natDegree (Polynomial.card_roots'). The set S of
  pairs is the union over x ∈ R of {(x, y) | the curve equation holds at (x, y)}, so Set.ncard S ≤ Σ_{x ∈ R} Set.ncard of the fibre, which is
  at most 2 for each x by bsd-410. Sum the bound: Set.ncard S ≤ 2 · R.card ≤ 2 · natDegree f. Use Set.ncard_le via an
  injection from the fibres, or Set.ncard_iUnion_le-type lemmas. If S is infinite its ncard is 0 and the bound holds,
  but here f ≠ 0 makes R finite, so S is finite.
