id: bsd-355
problem: bsd
title: 'Four-division roots: for an elliptic Weierstrass curve over a field and a nonsingular affine point (x, y) with 4 • P = 0 and 2 • P ≠ 0, the 4-division polynomial preΨ′ 4 vanishes at x'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-221
statement: |
  ∀ (K : Type) [Field K] [DecidableEq K] (W : WeierstrassCurve K) (x y : K)
    (h : W.toAffine.Nonsingular x y),
    (4 : ℕ) • (WeierstrassCurve.Affine.Point.some x y h : W.toAffine.Point) = 0 →
    (2 : ℕ) • (WeierstrassCurve.Affine.Point.some x y h : W.toAffine.Point) ≠ 0 →
    (W.preΨ' 4).eval x = 0
context: |
  The m = 4 instance of the division polynomial input bsd-198, in the form that bsd-354 (even-m torsion count) takes
  as a hypothesis: for m = 4 the affine points with 4 • P = 0 and 2 • P ≠ 0 are the points whose x-coordinate is a root
  of preΨ′ 4 = preΨ₄ (Mathlib's WeierstrassCurve.preΨ'_four). The case m = 5 (bsd-246) needed a resultant of degree 12;
  here the resultant is a perfect square. Let x2 be the x-coordinate of 2P (bsd-221). Since 2 • (2P) = 4 • P = 0, the point
  (x2, y2) is two-torsion, so f(x2) = 0 for the cubic f(X) = 4X³ + b₂X² + 2b₄X + b₆. Also x2 f(x) = x⁴ − b₄x² − 2b₆x − b₈.
  Eliminating x2 gives 4g³ + b₂g²f + 2b₄gf² + b₆f³ = 0 with g = x⁴ − b₄x² − 2b₆x − b₈, and this polynomial equals
  preΨ₄(x)² modulo 4b₈ = b₂b₆ − b₄² (sympy check; the quotient of the resultant by preΨ₄ is preΨ₄ itself). Hence
  preΨ₄(x) = 0. The statement holds over every field: the hypothesis 2 • P ≠ 0 gives y ≠ negY, which the doubling needs.
  Numerical check over F_5, F_7, F_11, F_13 (all short curves, all points with 4P = 0, 2P ≠ 0): no counterexample.
  Not checked by the checker yet; the Lean proof is in the bsd-355 solution branch.
sketch: |
  (1) y ≠ negY x y from 2 • P ≠ 0 (WeierstrassCurve.Affine.Point.add_self_of_Y_eq). (2) Doubling lemma bsd-221 gives
  P + P = (x2, y2) with x2 (2y + a₁x + a₃)² = x⁴ − b₄x² − 2b₆x − b₈. (3) (2y + a₁x + a₃)² = f(x) from the curve equation.
  (4) 2 • (P + P) = 4 • P = 0 gives f(x2) = 0 (the two-torsion cubic, as in bsd-353). (5) linear_combination with
  f³·f(x2) − M·(x2 f − g) + E·(4b₈ − b₂b₆ + b₄²) equal to preΨ₄(x)², where M = 4(u² + ug + g²) + b₂f(u + g) + 2b₄f², u = x2 f,
  and E is the explicit degree-8 polynomial in x (Mathlib: WeierstrassCurve.preΨ'_four, WeierstrassCurve.preΨ₄, b_relation).
  (6) pow_eq_zero_iff with exponent 2.
dead: []
