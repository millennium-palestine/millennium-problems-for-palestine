statement: |
  ∀ (K : Type) [Field K] (a b : K),
    (36 : K) ^ 11 *
      (32 * (X ^ 6 + 5 * C a * X ^ 4 + 20 * C b * X ^ 3 - 5 * C (a ^ 2) * X ^ 2
            - 4 * C (a * b) * X - C (a ^ 3) - 8 * C (b ^ 2)) *
        (X ^ 3 + C a * X + C b) ^ 2
      - (3 * X ^ 4 + 6 * C a * X ^ 2 + 12 * C b * X - C (a ^ 2)) ^ 3).resultant
        (derivative (32 * (X ^ 6 + 5 * C a * X ^ 4 + 20 * C b * X ^ 3 - 5 * C (a ^ 2) * X ^ 2
            - 4 * C (a * b) * X - C (a ^ 3) - 8 * C (b ^ 2)) *
        (X ^ 3 + C a * X + C b) ^ 2
      - (3 * X ^ 4 + 6 * C a * X ^ 2 + 12 * C b * X - C (a ^ 2)) ^ 3)) 12 11 =
    12 ^ 11 * 3600 *
      (31 * C a * X ^ 10 + 285 * C b * X ^ 9 - 105 * C (a ^ 2) * X ^ 8 + 300 * C (a * b) * X ^ 7
      - 450 * C (a ^ 3) * X ^ 6 - 360 * C (b ^ 2) * X ^ 6 - 1218 * C (a ^ 2 * b) * X ^ 5
      - 250 * C (a ^ 4) * X ^ 4 - 3840 * C (a * b ^ 2) * X ^ 4 - 180 * C (a ^ 3 * b) * X ^ 3
      - 3600 * C (b ^ 3) * X ^ 3 - 125 * C (a ^ 5) * X ^ 2 - 600 * C (a ^ 2 * b ^ 2) * X ^ 2
      - 275 * C (a ^ 4 * b) * X - 1760 * C (a * b ^ 3) * X + 3 * C (a ^ 6) - 96 * C (a ^ 3 * b ^ 2)
      - 768 * C (b ^ 4)).resultant
        (derivative (32 * (X ^ 6 + 5 * C a * X ^ 4 + 20 * C b * X ^ 3 - 5 * C (a ^ 2) * X ^ 2
            - 4 * C (a * b) * X - C (a ^ 3) - 8 * C (b ^ 2)) *
        (X ^ 3 + C a * X + C b) ^ 2
      - (3 * X ^ 4 + 6 * C a * X ^ 2 + 12 * C b * X - C (a ^ 2)) ^ 3)) 10 11
context: |
  The resultant transfer that moves bsd-361 off the degree-12 polynomial. Let f be the short-form preΨ′ 5 of
  bsd-364 (in a = a₄, b = a₆), g = f′ its derivative (leading coefficient 60, degree 11), and N the polynomial of
  bsd-365, so 36 f = 3X g + 12 N. Mathlib's resultant_C_mul_left gives Res(36 f, g) = 36^11 Res(f, g) at degrees 12,
  11. The identity 36 f = 12 N + g · (3X) and resultant_add_mul_left (degree of 3X plus 11 is at most 12) give
  Res(12 N, g) = 12^11 Res(N, g) at degrees 12, 11. Finally the formal degree bump from 10 to 12 for N gives
  lc(g)^2 = 60^2 with sign (−1)^(11·2) = 1 (resultant_add_left_deg). So 36^11 Res_{12,11}(f, g) =
  12^11 · 3600 · Res_{10,11}(N, g) holds with no division: the statement is kept in this form on purpose, so the
  proof never cancels 12^11 (a cancellation would fail in characteristic 2 and 3). Sympy (exact, over ℤ[a, b])
  confirms the corresponding identity 3^11 · Res(f, g) = 3600 · Res(N, g). Together with bsd-364 and bsd-365 this
  leaves bsd-361 as the single identity Res_{10,11}(N, g) = 3⁹ · 5¹⁰ · 2⁸⁴ · (4a³ + 27b²)², which is a 21 × 21
  determinant identity over ℤ[a, b].
sketch: |
  Let f, g := derivative f, N be the three polynomials (set). Turn 36 into C 36 with map_ofNat and rewrite with
  bsd-365 as C 36 * f = 12 * N + g * (3 * X). Apply resultant_C_mul_left (r = 36), then resultant_add_mul_left
  with p = 3 * X, m = 12, n = 11: its hypotheses are natDegree (3 * X) + 11 ≤ 12 and natDegree g ≤ 11, where
  natDegree g ≤ natDegree f − 1 ≤ 11 by natDegree_derivative_le and compute_degree!. Then resultant_C_mul_left
  with r = 12 and natDegree N ≤ 10 (compute_degree!) for resultant_add_left_deg with m = 10, k = 2, n = 11:
  coeff g 11 = 60 by coeff_derivative and coeff f 12 = 5 (compute_degree!). Finish with ring/norm_num on the sign
  (−1)^22 = 1 and 60^2 = 3600. Mathlib: Polynomial.resultant, resultant_C_mul_left, resultant_add_mul_left,
  resultant_add_left_deg, natDegree_derivative_le, coeff_derivative, compute_degree.
