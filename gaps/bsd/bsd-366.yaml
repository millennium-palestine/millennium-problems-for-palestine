id: bsd-366
problem: bsd
title: 'Resultant transfer for the five-division polynomial: over any field, 36 to the 11 times the resultant of f and f′ at degrees 12 and 11 equals 12 to the 11 times 3600 times the resultant of N and f′ at degrees 10 and 11'
status: open
imports:
