id: bsd-254
problem: bsd
title: 'Toeplitz symbol nonvanishing: for a prime p > 2 and a short cubic with nonzero discriminant, the K×K determinant of the symbols c_s + d_s·Y, K = (p−1)/2, is nonzero in F_p[Y]'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (p : ℕ) [Fact p.Prime] (a b : ZMod p), 2 < p → 4 * a ^ 3 + 27 * b ^ 2 ≠ 0 →
    ∀ g : Polynomial (ZMod p),
      g = (Polynomial.X ^ 3 + Polynomial.C a * Polynomial.X + Polynomial.C b) ^ ((p - 1) / 2) →
      (Matrix.of (fun (i t : Fin ((p - 1) / 2)) =>
        Polynomial.C (g.coeff ((p - 1) / 2 + (i : ℕ) - (t : ℕ))) +
          Polynomial.C (g.coeff ((p - 1) / 2 + (i : ℕ) - (t : ℕ) + p)) * (Polynomial.X : Polynomial (ZMod p)))).det ≠ 0
context: |
  The hard core of bsd-183 (the Stepanov nonvanishing step for the level-set bound bsd-172), split off from the
  transfer step bsd-253. Write g = f^((p−1)/2) with f = X³ + aX + b and g_s(Y) = c_s + d_s·Y, where c_s is the
  coefficient of X^s in g and d_s the coefficient of X^(s+p) (bsd-195 makes this decomposition of g, since deg g < 2p).
  With K = (p−1)/2 the Toeplitz matrix (g_{K+i−t}(Y))_{i,t<K} has determinant nonzero in F_p[Y] exactly when the
  bsd-183 statement holds for all J (bsd-253 gives the implication from this determinant to bsd-183). The statement is
  the claim that the K×K determinant is a nonzero polynomial in Y. Numerically this holds for all nonsingular short
  cubics over F_p with p ≤ 23 (all pairs checked by computer, not a proof), and for one cubic with p ≤ 61. It is
  believed true, but no proof is known to the proposer, and it is NOT an hour's work. Any proof must be a genuinely
  new argument about the coefficients of f^((p−1)/2) (a Stepanov-type or Hermite-type identity), and not a
  specialisation that is already known to vanish. A reduction worth checking: the determinant is nonzero iff its
  value modulo f(Y) is nonzero, since f is squarefree, and that value is the Toeplitz minor evaluated at a root of f.
sketch: |
  Not an hour's work. Route to try: (1) reduce to a root y of X³ + aX + b in the algebraic closure, so that
  the symbol becomes G_y(X) = Σ_{s<p} (c_s + d_s y) X^s, which is the unique polynomial of degree below p congruent
  to g modulo X^p − y, hence (X − z)^((p−1)/2) times a polynomial of degree at most (p−1)/2 with z^p = y; (2) show
  that the Toeplitz minor of the coefficients of G_y at indices K+i−t is nonzero, which is a Padé-type nonsingularity
  statement for the middle coefficients. Step (2) has no proof yet. Do not claim without a complete proof or a
  counterexample; a counterexample (a cubic with p ≤ 23 and zero determinant) also counts as a precise report.
dead: []
