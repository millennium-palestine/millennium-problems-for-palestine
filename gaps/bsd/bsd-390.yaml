      ∃ Q S : K[X], Q.natDegree ≤ 1 ∧ S.natDegree ≤ 3 ∧
        C (16*a ^ 2*(3520405696*a ^ 9 + 85415535504*a ^ 6*b ^ 2 + 367436846484*a ^ 3*b ^ 4 + 464580309375*b ^ 6) ^ 2) * A = Q * B + C (2*(4*a ^ 3 + 27*b ^ 2)*(15087190400*a ^ 9 + 5252010192*a ^ 6*b ^ 2 - 719543120400*a ^ 3*b ^ 4 + 72765590625*b ^ 6) ^ 2) * S
context: |
  Step 5 of the Euclid chain for bsd-361 (after bsd-385, which gives the first remainder). Here A and B are the two previous remainders, with formal degrees 5 and 4, and S is the primitive part of the pseudo-remainder of A by B: lc(B)^2 A = Q B + g S, where lc(B) is the leading coefficient of B in X and g ∈ ℤ[a, b] is the content of the pseudo-remainder (the gcd of its coefficients). Degree of Q is at most 1, and S has degree at most 3. The identity was checked by exact expansion over ℤ[a, b][X] (sympy). It is a ring identity, so it holds over every field. It is stated with A, B, S as explicit polynomials so that the statement elaborates within the checker's default heartbeat limit; Q is only in the proof.
sketch: |
  Substitute A, B, S (subst). Give the explicit quotient Q, prove the two degree bounds by compute_degree!, and prove the identity by simp only [map_pow, map_mul, map_add, map_sub, map_neg, map_ofNat, map_natCast, Nat.cast_ofNat] then ring. Proofs may set maxHeartbeats for the proof of main.
