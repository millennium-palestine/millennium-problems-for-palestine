statement: |
  ∀ (K : Type) [Field K] (a b : K) (A B : K[X]),
      A = (C (-90523142400 * a ^ 9 - 31512061152 * a ^ 6 * b ^ 2 + 4317258722400 * a ^ 3 * b ^ 4 - 436593543750 * b ^ 6) * X ^ 5
        + C (-636093694656 * a ^ 8 * b - 3499761761568 * a ^ 5 * b ^ 3 + 8885014456500 * a ^ 2 * b ^ 5) * X ^ 4
        + C (4496739200 * a ^ 10 - 604284248160 * a ^ 7 * b ^ 2 - 5159026711800 * a ^ 4 * b ^ 4 + 4671390993750 * a * b ^ 6) * X ^ 3
        + C (-104602815552 * a ^ 9 * b + 1525040784 * a ^ 6 * b ^ 3 + 2402234698500 * a ^ 3 * b ^ 5 - 155926265625 * b ^ 7) * X ^ 2
        + C (-9623862400 * a ^ 11 - 453119241024 * a ^ 8 * b ^ 2 - 1827800593992 * a ^ 5 * b ^ 4 + 3584608911000 * a ^ 2 * b ^ 6) * X
        + C (-3351648256 * a ^ 10 * b - 224166054960 * a ^ 7 * b ^ 3 - 1107220275720 * a ^ 4 * b ^ 5 + 1180081963125 * a * b ^ 7)) →
