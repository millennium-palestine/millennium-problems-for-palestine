id: bsd-385
problem: bsd
title: 'Euclid step for the five-division resultant: over any field, with N the degree-10 polynomial of bsd-365 and R the remainder of bsd-379, (791120 a^3 + 4873500 b^2)^2 times N is Q R + R2 for some Q of degree at most 1 and R2 of degree at most 8'
status: open
imports:
- Mathlib
open:
- Polynomial
depends: []
statement: |
  ∀ (K : Type) [Field K] (a b : K) (N R : K[X]),
    N = 31 * C a * X ^ 10 + 285 * C b * X ^ 9 - 105 * C (a ^ 2) * X ^ 8 + 300 * C (a * b) * X ^ 7
      - 450 * C (a ^ 3) * X ^ 6 - 360 * C (b ^ 2) * X ^ 6 - 1218 * C (a ^ 2 * b) * X ^ 5
      - 250 * C (a ^ 4) * X ^ 4 - 3840 * C (a * b ^ 2) * X ^ 4 - 180 * C (a ^ 3 * b) * X ^ 3
      - 3600 * C (b ^ 3) * X ^ 3 - 125 * C (a ^ 5) * X ^ 2 - 600 * C (a ^ 2 * b ^ 2) * X ^ 2
      - 275 * C (a ^ 4 * b) * X - 1760 * C (a * b ^ 3) * X + 3 * C (a ^ 6) - 96 * C (a ^ 3 * b ^ 2)
      - 768 * C (b ^ 4) →
    R = (791120 * C (a ^ 3) + 4873500 * C (b ^ 2)) * X ^ 9
      + 933120 * C (a ^ 2 * b) * X ^ 8
      + (29760 * C (a ^ 4) + 5799600 * C (a * b ^ 2)) * X ^ 7
      + (-3815040 * C (a ^ 3 * b) - 6156000 * C (b ^ 3)) * X ^ 6
      + (-1264800 * C (a ^ 5) - 15069240 * C (a ^ 2 * b ^ 2)) * X ^ 5
      + (-7284480 * C (a ^ 4 * b) - 58968000 * C (a * b ^ 3)) * X ^ 4
      + (-248000 * C (a ^ 6) - 9342480 * C (a ^ 3 * b ^ 2) - 61560000 * C (b ^ 4)) * X ^ 3
      + (-1856640 * C (a ^ 5 * b) - 11599200 * C (a ^ 2 * b ^ 3)) * X ^ 2
      + (-101680 * C (a ^ 7) - 4985220 * C (a ^ 4 * b ^ 2) - 28667520 * C (a * b ^ 4)) * X
      + (-44800 * C (a ^ 6 * b) - 2256640 * C (a ^ 3 * b ^ 3) - 13132800 * C (b ^ 5)) →
      ∃ Q R2 : K[X], Q.natDegree ≤ 1 ∧ R2.natDegree ≤ 8 ∧
      (791120 * C (a ^ 3) + 4873500 * C (b ^ 2)) ^ 2 * N = Q * R + R2
context: |
  Next Euclid step of the bsd-361 chain (the resultant of the short-form five-division polynomial f and its
  derivative f′). Here N is the degree-10 polynomial of bsd-365 (leading coefficient 31 a) and R is the
  remainder of bsd-379, (31 a)² f′ = 60 (31 a X − 285 b) N + R, with deg R = 9 and leading coefficient
  c = 791120 a³ + 4873500 b². The step divides c² N by R: c² N = Q R + R2 with quotient Q of degree 1 and
  remainder R2 of degree 8. The identity was computed by exact expansion over ℤ[a, b][X] (sympy) and R2 was
  found to have degree 8 with integer coefficients, gcd 1153200 among them. It is a ring identity and holds
  over every commutative ring, in particular over every field.
  It is stated as an existence of the quotient and remainder, with the degree bounds, so that the explicit
    coefficients of Q and R2 appear only in the proof and the statement elaborates within the checker's default
    heartbeat limit (an earlier draft with the explicit Q and R2 in the statement timed out). Proofs may use
    set_option maxHeartbeats for the proof of main.
sketch: |
  Substitute N and R (subst). Give the explicit quotient Q = (24524720 a^4 + 151078500 a b^2) X + (196542480 a^3 b + 1388947500 b^3)
    and the explicit remainder R2 = c^2 N - Q R (its 28 coefficients are integers, see the context), then prove the two
    degree bounds by compute_degree! and the identity by map_* simp lemmas and ring.
    Mathlib: Polynomial.natDegree, compute_degree, map_pow, map_mul, ring.
