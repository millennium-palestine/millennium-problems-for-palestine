id: bsd-253
problem: bsd
title: 'Toeplitz transfer: over a domain R, a polynomial B of degree below K whose coefficients at K, ..., 2K−1 in G·B all vanish, with det(G_{K+i−t}) ≠ 0, is zero'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (R : Type) [CommRing R] [IsDomain R] (K : ℕ) (G B : Polynomial R),
    B.natDegree < K →
    (∀ i : Fin K, (G * B).coeff (K + (i : ℕ)) = 0) →
    (Matrix.of (fun (i t : Fin K) => G.coeff (K + (i : ℕ) - (t : ℕ)))).det ≠ 0 →
    B = 0
context: |
  The square-system core of Step 1 of the bsd-183 reduction, over an arbitrary domain. It is stated for B of
  degree below K, so it does not by itself apply to bsd-183's B = Σ_j X^(pj) r_{1j} (degree up to pJ). In bsd-183
  the coefficient ring is R = F_p[Y] (Y = X^p) and the unknowns are β_t(Y) with B = Σ_{t<K} X^t β_t(X^p), and the
  coefficient comparison at the exponents K ≤ u < 2K becomes Σ_{t<K} g_{K+i−t}(Y) β_t(Y) = 0, i < K, where
  g_s(Y) = c_s + d_s Y. Bringing bsd-183 to that square system is a separate bookkeeping step (not proposed here).
  The statement is the case deg B < K: a nonzero Toeplitz determinant over a domain forces B to vanish.
  It is elementary linear algebra. The determinant itself is the separate open gap bsd-254. Proof route:
  Matrix.eq_zero_of_mulVec_eq_zero (or the adjugate identity) on the coefficient vector t ↦ B.coeff t.
sketch: |
  Write B as Σ_{t<K} C (B.coeff t) * X^t (Polynomial.as_sum_range' from natDegree < K). For i < K the coefficient
  of G * B at K + i is Σ_{t<K} (G.coeff (K + i − t)) * B.coeff t: multiply out with Polynomial.coeff_mul_X_pow' and
  Polynomial.coeff_mul_C, using t < K ≤ K + i so the if-condition holds. Hence the matrix M i t := G.coeff (K + i − t)
  satisfies M *ᵥ (fun t => B.coeff t) = 0 (Matrix.mulVec, Finset.sum_congr). The hypothesis det M ≠ 0 with R a
  domain gives the coefficient vector zero (Matrix.eq_zero_of_mulVec_eq_zero, or Matrix.mulVec of adjugate times det).
  Then B.coeff t = 0 for t < K, and B.coeff t = 0 for t ≥ K by natDegree, so B = 0 by Polynomial.ext.
  Watch the natural-number subtraction K + i − t (it is fine because t < K) and the Fin coercions.
