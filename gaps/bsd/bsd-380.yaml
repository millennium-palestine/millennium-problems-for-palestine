id: bsd-380
problem: bsd
title: 'Resultant transfer by one pseudo-division step: over any field, (31 a)^20 times the resultant of N and the derivative of the short-form five-division polynomial at degrees 10 and 11 equals the resultant of N and the remainder R at degrees 10 and 11'
status: open
imports:
- Mathlib
open:
- Polynomial
depends: []
statement: |
  ∀ (K : Type) [Field K] (a b : K) (N g R : K[X]),
    N = 31 * C a * X ^ 10 + 285 * C b * X ^ 9 - 105 * C (a ^ 2) * X ^ 8 + 300 * C (a * b) * X ^ 7
      - 450 * C (a ^ 3) * X ^ 6 - 360 * C (b ^ 2) * X ^ 6 - 1218 * C (a ^ 2 * b) * X ^ 5
      - 250 * C (a ^ 4) * X ^ 4 - 3840 * C (a * b ^ 2) * X ^ 4 - 180 * C (a ^ 3 * b) * X ^ 3
      - 3600 * C (b ^ 3) * X ^ 3 - 125 * C (a ^ 5) * X ^ 2 - 600 * C (a ^ 2 * b ^ 2) * X ^ 2
      - 275 * C (a ^ 4 * b) * X - 1760 * C (a * b ^ 3) * X + 3 * C (a ^ 6) - 96 * C (a ^ 3 * b ^ 2)
      - 768 * C (b ^ 4) →
    g = derivative (32 * (X ^ 6 + 5 * C a * X ^ 4 + 20 * C b * X ^ 3 - 5 * C (a ^ 2) * X ^ 2
            - 4 * C (a * b) * X - C (a ^ 3) - 8 * C (b ^ 2)) *
        (X ^ 3 + C a * X + C b) ^ 2
      - (3 * X ^ 4 + 6 * C a * X ^ 2 + 12 * C b * X - C (a ^ 2)) ^ 3) →
    R = (- 44800 * C (a ^ 6 * b) - 2256640 * C (a ^ 3 * b ^ 3) - 13132800 * C (b ^ 5)
      + (- 101680 * C (a ^ 7) - 4985220 * C (a ^ 4 * b ^ 2) - 28667520 * C (a * b ^ 4)) * X
      + (- 1856640 * C (a ^ 5 * b) - 11599200 * C (a ^ 2 * b ^ 3)) * X ^ 2
      + (- 248000 * C (a ^ 6) - 9342480 * C (a ^ 3 * b ^ 2) - 61560000 * C (b ^ 4)) * X ^ 3
      + (- 7284480 * C (a ^ 4 * b) - 58968000 * C (a * b ^ 3)) * X ^ 4
      + (- 1264800 * C (a ^ 5) - 15069240 * C (a ^ 2 * b ^ 2)) * X ^ 5
      + (- 3815040 * C (a ^ 3 * b) - 6156000 * C (b ^ 3)) * X ^ 6
      + (29760 * C (a ^ 4) + 5799600 * C (a * b ^ 2)) * X ^ 7
      + 933120 * C (a ^ 2 * b) * X ^ 8
      + (791120 * C (a ^ 3) + 4873500 * C (b ^ 2)) * X ^ 9) →
    (31 * a) ^ 20 * N.resultant g 10 11 = N.resultant R 10 11
context: |
  The Euclid step behind bsd-361, after bsd-379. Let g = f′ be the derivative of the short-form five-division
  polynomial f in a = a₄, b = a₆, let N be the degree-10 polynomial of bsd-365 (leading coefficient 31 a), and let
  R be the remainder of bsd-379, so that (31 a)² g = q N + R with q = 60 (31 a X − 285 b) and deg R ≤ 9. A resultant
  of formal degrees 10 and 11 is unchanged when a multiple of N is added to the second argument (the degree bounds
  are kept), and it scales by c^10 when the second argument is multiplied by a constant c. Hence
  (31 a)^20 Res_{10,11}(N, g) = Res_{10,11}(N, R). The three polynomials are given as hypotheses so that the
  statement elaborates within the checker's heartbeat limit; the identity is the same. The factor (31 a)^20 stays
  on purpose: there is no division by a. The identity was checked numerically (exact Sylvester determinants, formal
  degrees 10 and 11) at (a, b) = (2, 3), (1, 1), (−5, 7), (3, 0), (0, 2), (4, −1). It does not finish bsd-361: the
  core Res_{10,11}(N, R) still has to be computed, and the Euclid chain has about ten further steps, each with a
  leading coefficient that is a power of a.
sketch: |
  Substitute N, g, R (subst). Rewrite the left side with resultant_C_mul_right or the matching Mathlib lemma for a
  constant second argument, after writing (31 a)^20 = ((31 a)^2)^10 and (31 a)^2 g = q N + R from bsd-379 (the
  identity is a ring identity on the expanded forms, so it can be cited as a separate lemma). Then use the lemma
  that a multiple of the first argument can be added to the second (resultant_add_mul_left or the matching
  Mathlib name, check its exact form), with natDegree q ≤ 1 and natDegree N = 10 by compute_degree!. Degree of g is at
  most 11 by natDegree_derivative_le. Mathlib: Polynomial.resultant, Polynomial.sylvester, resultant_C_mul_right,
  resultant_add_mul_left, resultant_add_left_deg, natDegree_derivative_le, compute_degree.
