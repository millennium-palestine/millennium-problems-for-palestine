id: bsd-299
problem: bsd
title: 'Squarefree preΨ′ 5 with a₁ = a₃ = 0 and a₂ ≠ 0 in characteristic 3: over a field with 3 = 0 and 5 nonzero, the preΨ′ 5 of every elliptic Weierstrass curve with a₁ = a₃ = 0 and a₂ ≠ 0 is squarefree'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-298
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) [W.IsElliptic],
    (3 : K) = 0 → (5 : K) ≠ 0 → W.a₁ = 0 → W.a₃ = 0 → W.a₂ ≠ 0 → Squarefree (W.preΨ' 5)
context: |
  The remaining case of bsd-296 once bsd-298 (a₂ = 0) is in place. In characteristic 3 the shift x ↦ x + r does not change
  a₂ (it changes a₄ by 2 r a₂ and a₂ by 3 r = 0), so bsd-288 cannot be used. But it does kill a₄: with r = −a₄ / (2 a₂) the
  shifted curve has a₄ = 0. In that slice the discriminant is Δ = −a₆ a₂³ in characteristic 3, and the Bezout constant
  Res = 5¹² Δ²² (checked over ℚ[a₂, a₆] by resultant, and over F₃(a₂, a₆) by the same Euclid computation) is the only
  certificate the sketch needs. Nothing here is checked in Lean. A counterexample to the statement counts as much as a proof.
sketch: |
  Step 1 (shift): for W with a₁ = a₃ = 0, a₂ ≠ 0 and characteristic 3, the Weierstrass curve obtained by x ↦ x + r with
  r = −a₄/(2a₂) has a₁ = a₃ = a₄ = 0, the same a₂, the same unit discriminant, and preΨ′ 5 transported by the shift, so
  squarefreeness transfers. Step 2 (slice): for a₄ = 0 and a₂ ≠ 0, a Bezout identity A·f + B·f′ = c·Δ^k with f = preΨ′ 5
  and c a unit in F₃ gives squarefreeness. Step 2 is a polynomial identity in ℤ[a₂, a₆][X] of degree 12 in X; the
  certificate has to be computed, since the ideal (f, f′) ∩ ℚ[a₂, a₆] is generated by the resultant 5¹² Δ²².
dead:
  - |
    A sympy pseudo-Euclid over ℤ[a₂, a₆] for the a₄ = 0 slice did not finish: the coefficient growth made step 7 take about
    250 s and the run was stopped. Over F₃[a₂, a₆] the pseudo-quotients grow to thousands of monomials. Fraction-field Euclid
    over GF(3)(a₂, a₆) did not finish in 500 s either. A certificate needs a subresultant or modular method.
  - |
    Ring-checking the full 23 × 23 Sylvester resultant of preΨ′ 5 with symbolic a₂, a₄, a₆ is too large for one `ring`.
