id: bsd-299
problem: bsd
title: 'Squarefree preΨ′ 5 with a₁ = a₃ = 0 and a₂ ≠ 0 in characteristic 3: over a field with 3 = 0 and 5 nonzero, the preΨ′ 5 of every elliptic Weierstrass curve with a₁ = a₃ = 0 and a₂ ≠ 0 is squarefree'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-298
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) [W.IsElliptic],
    (3 : K) = 0 → (5 : K) ≠ 0 → W.a₁ = 0 → W.a₃ = 0 → W.a₂ ≠ 0 → Squarefree (W.preΨ' 5)
context: |
  The remaining case of bsd-296 once bsd-298 (a₂ = 0) is in place. In characteristic 3 the shift x ↦ x + r does not change
  a₂ (it changes a₄ by 2 r a₂ and a₂ by 3 r = 0), so bsd-288 cannot be used. But it does kill a₄: with r = −a₄ / (2 a₂) the
  shifted curve has a₄ = 0. In that slice the discriminant is Δ = −a₆ a₂³ in characteristic 3. A Bezout certificate for the
  slice exists over F₃[a₂, a₆] with 17 + 17 terms (computed by linear algebra mod 3 on a weighted ansatz; see the sketch).
  Nothing here is checked in Lean. A counterexample to the statement counts as much as a proof.
sketch: |
  Step 1 (shift): for W with a₁ = a₃ = 0, a₂ ≠ 0 and characteristic 3, the Weierstrass curve obtained by x ↦ x + r with
  r = −a₄/(2a₂) has a₁ = a₃ = a₄ = 0, the same a₂, the same unit discriminant, and preΨ′ 5 transported by the shift, so
  squarefreeness transfers.
  Step 2 (slice, computed): for the slice a₁ = a₃ = a₄ = 0 in characteristic 3, with f = preΨ′ 5 (degree 12 in X, leading
  coefficient 5 ≡ 2), a computer check found A and B in F₃[a₂, a₆][X] with
    A·f + B·f′ = a₂⁶⁶ · a₆²² = (−Δ)²² (mod 3),
  where f′ is the X-derivative. Since a unit Δ makes a₂ and a₆ nonzero, this gives squarefreeness by bsd-282. Explicitly
    A = −X⁹a₂⁶⁰a₆¹⁷ + X⁹a₂⁵⁷a₆¹⁸ − X⁸a₂⁶¹a₆¹⁷ + X⁷a₂⁵⁹a₆¹⁸ − X⁶a₂⁵⁷a₆¹⁹ + X⁵a₂⁶¹a₆¹⁸ + X⁵a₂⁵⁸a₆¹⁹ − X⁴a₂⁵⁹a₆¹⁹
      + X³a₂⁶³a₆¹⁸ − X³a₂⁶⁰a₆¹⁹ + X³a₂⁵⁷a₆²⁰ + X²a₂⁶¹a₆¹⁹ + X²a₂⁵⁸a₆²⁰ + X a₂⁶²a₆¹⁹ − X a₂⁵⁹a₆²⁰ − a₂⁶³a₆¹⁹ − a₂⁶⁰a₆²⁰
    B = −X¹¹a₂⁵⁹a₆¹⁷ + X¹¹a₂⁵⁶a₆¹⁸ − X¹⁰a₂⁶⁰a₆¹⁷ + X⁹a₂⁶¹a₆¹⁷ − X⁷a₂⁶⁰a₆¹⁸ − X⁶a₂⁶¹a₆¹⁸ − X⁶a₂⁵⁸a₆¹⁹ − X⁵a₂⁵⁹a₆¹⁹
      + X⁴a₂⁶³a₆¹⁸ − X⁴a₂⁶⁰a₆¹⁹ + X³a₂⁶¹a₆¹⁹ + X³a₂⁵⁸a₆²⁰ − X²a₂⁵⁹a₆²⁰ + X²a₂⁵⁶a₆²¹ − X a₂⁶³a₆¹⁹ + a₂⁶¹a₆²⁰ − a₂⁵⁸a₆²¹
  The Lean side needs the identity with the integer coefficients of f, which vanish mod 3 in K, so the check is a
  linear_combination with a multiple of (3 : K) = 0. The step from a₄ = 0 to general a₄ is the shift of Step 1, which has
  not been formalised. Step 2 is not checked in Lean yet.
dead:
  - |
    A sympy pseudo-Euclid over ℤ[a₂, a₆] for the a₄ = 0 slice did not finish: the coefficient growth made step 7 take about
    250 s and the run was stopped. Over F₃[a₂, a₆] the pseudo-division remainder exploded into thousands of monomials, and
    fraction-field Euclid over GF(3)(a₂, a₆) did not finish in 500 s. The weighted linear-algebra ansatz above works, the
    Euclid runs do not.
  - |
    A weighted linear-algebra ansatz over F₃[a₂, a₄, a₆] for the general curve, with the a₄-degree of A and B capped at 1 or
    at 3, is inconsistent. Without the cap the system has about 27 000 unknowns, too large for dense elimination here.
  - |
    Ring-checking the full 23 × 23 Sylvester resultant of preΨ′ 5 with symbolic a₂, a₄, a₆ is too large for one `ring`.
