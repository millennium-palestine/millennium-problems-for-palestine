id: bsd-103
problem: bsd
title: 'Weak Mordell–Weil for the irreducible short form: for y² = x³ + px + q over ℚ with x³ + px + q irreducible, E(ℚ) modulo twice itself is finite'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-078
- bsd-082
- bsd-083
- bsd-086
statement: |
  ∀ (p q : ℚ) (E : WeierstrassCurve ℚ) [E.IsElliptic], E.a₁ = 0 → E.a₂ = 0 → E.a₃ = 0 → E.a₄ = p → E.a₆ = q →
    Irreducible (Polynomial.X ^ 3 + Polynomial.C p * Polynomial.X + Polynomial.C q) →
    ∃ s : Finset E.toAffine.Point, ∀ P : E.toAffine.Point, ∃ Q ∈ s, ∃ R : E.toAffine.Point, P = Q + 2 • R
context: |
  The irreducible-cubic case of the weak Mordell–Weil theorem bsd-036, for curves in short form. The rest of bsd-036
  (the cubic with a rational root, and the reduction to short form in bsd-079) is separate. The Kummer map sends an affine
  point (x, y) to the square class of x − θ in L* / L*², where L = ℚ[X]/(f) and θ is the class of X. For an irreducible
  cubic no rational point has y = 0 (that would make x a rational root of f), and x ≠ θ, so the class is defined on every
  affine point, and it is 1 on the origin. It is a homomorphism by bsd-078 (the Kummer identity on a field containing a
  root t, here t = θ in L). Its kernel is twice the group by bsd-083 (square roots in coordinates) and bsd-082 (the
  kernel of the Kummer map for an irreducible cubic). Its image lies in the finite set of classes given by bsd-075, so
  bsd-086 (the fibre argument) gives the finite set s. This gap is the irreducible case; the one-root and split cases are
  separate gaps.
sketch: |
  (a) Define κ : E(ℚ) → Additive (Lˣ ⧸ squares) by κ(0) = 0 and κ(x, y) = the class of x − θ, using that x − θ ≠ 0
  because θ is not rational. (b) κ is additive: for P + Q = R with affine points, bsd-078 gives that the product of
  (x_R − θ)(x_P − θ)(x_Q − θ) is a square, and the case P + Q = 0 gives κ(P) = κ(Q) so the two classes multiply to a
  square. (c) The image is finite: each class is one of the finitely many classes of bsd-075. (d) The kernel is 2E(ℚ):
  κ(P) = κ(Q) gives that the class of x(P − Q) − θ is trivial, so it is a square in L, its coordinates are rational
  (bsd-083), and bsd-082 gives R with R + R = P − Q. (e) bsd-086 gives s.
