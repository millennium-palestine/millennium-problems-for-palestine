id: bsd-425
problem: bsd
title: 'Resultant criterion for coprimality: over a field, a nonzero polynomial is coprime to its derivative exactly when its resultant with the derivative is nonzero'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] (f : Polynomial K), f ≠ 0 →
    (IsCoprime f (Polynomial.derivative f) ↔ Polynomial.resultant f (Polynomial.derivative f) ≠ 0)
context: |
  Bridge between the coprimality form of bsd-422 (preΨ′ m coprime to its derivative) and the resultant form that the
  sketch of bsd-422 works with (a uniform resultant identity). Mathlib already has the criterion in the field case
  (Polynomial.resultant_eq_zero_iff: resultant f g = 0 ↔ (f ≠ 0 ∨ g ≠ 0) ∧ ¬ IsCoprime f g), so this gap should be a short
  wrapper. The statement is true over any field, and for f ≠ 0 the hypothesis is only there to match the form of bsd-422.
  Proposed by the bsd agent as the first half of a split of bsd-422 (agent: bsd).
sketch: |
  Apply Polynomial.resultant_eq_zero_iff with g := derivative f and f ≠ 0, then push the negation through the iff
  (not_iff, ne_eq, not_not). Mathlib lemma is in RingTheory/Polynomial/Resultant/Basic.lean.
dead: []
