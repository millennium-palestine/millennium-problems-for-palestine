id: bsd-077
problem: bsd
title: 'Kummer doubling on Mathlib points over a field: for a Weierstrass curve y² = x³ + px + q over ℚ, a nonsingular affine point with y ≠ 0 and x-coordinate not at a root t in K has P + P with x-coordinate minus t a square in K'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (p q : ℚ) (K : Type) [Field K] [Algebra ℚ K] (t : K) (E : WeierstrassCurve ℚ),
    E.a₁ = 0 → E.a₂ = 0 → E.a₃ = 0 → E.a₄ = p → E.a₆ = q →
    t ^ 3 + algebraMap ℚ K p * t + algebraMap ℚ K q = 0 →
    ∀ (x1 y1 : ℚ) (h1 : E.toAffine.Nonsingular x1 y1), y1 ≠ 0 → algebraMap ℚ K x1 ≠ t →
      ∃ (x3 y3 : ℚ) (h3 : E.toAffine.Nonsingular x3 y3),
        WeierstrassCurve.Affine.Point.some _ _ h1 + WeierstrassCurve.Affine.Point.some _ _ h1 =
          WeierstrassCurve.Affine.Point.some _ _ h3 ∧
        ∃ r : K, algebraMap ℚ K x3 - t = r ^ 2
context: |
  Point-level form of bsd-076 on Mathlib's group law: the doubling case of the Kummer homomorphism of bsd-036 (weak
  Mordell–Weil), as bsd-068 is the point-level form of bsd-067 for distinct x-coordinates. For y ≠ 0 the point P is
  not 2-torsion, so P + P is an affine point, and its x-coordinate minus t is a square in K when x(P) is not at t.
  Together with bsd-068 this covers every sum of affine points whose x-coordinates avoid t, except the case P = −Q, which
  gives O. The curve is in the form a₁ = a₂ = a₃ = 0, a₄ = p, a₆ = q, as in bsd-068.
sketch: |
  Get the curve equation from `WeierstrassCurve.Affine.equation_iff` on `h1.1` and rewrite the coefficients, as in
  bsd-068. Use `WeierstrassCurve.Affine.Point.add_self_of_Y_ne`, whose hypothesis y1 ≠ W.negY x1 y1 reduces to y1 ≠ 0
  after unfolding `negY` with the zero coefficients. Then `refine ⟨_, _, _, _, ?_⟩` with the doubling lemma. Use
  `WeierstrassCurve.Affine.slope_of_Y_ne rfl` and `WeierstrassCurve.Affine.addX` to identify the slope and the new
  x-coordinate as λ² − 2x₁ with 2λy₁ = 3x₁² + p, which is the hypothesis form of bsd-076. Finish with bsd-076 proved
  inside as a `have`, and `linear_combination` if needed.
