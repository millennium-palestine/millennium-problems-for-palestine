id: bsd-376
problem: bsd
title: 'Level-set character identity: over a prime field with p ≠ 2, the quadratic character sum of x³ + ax + b equals the number of x with (x³ + ax + b)^((p−1)/2) = 1 minus the number with value −1'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (p : ℕ) [Fact p.Prime], p ≠ 2 → ∀ a b : ZMod p,
    ∑ x : ZMod p, quadraticChar (ZMod p) (x ^ 3 + a * x + b) =
      ((Finset.univ.filter (fun x : ZMod p => (x ^ 3 + a * x + b) ^ ((p - 1) / 2) = 1)).card : ℤ)
        - ((Finset.univ.filter (fun x : ZMod p => (x ^ 3 + a * x + b) ^ ((p - 1) / 2) = -1)).card : ℤ)
context: |
  First step of the level-set assembly behind bsd-172 (Stepanov's level-set bound). The level sets
  T_ε = {x : (x³ + ax + b)^((p−1)/2) = ε} with ε = ±1 are the sets that bsd-172 bounds, and this identity
  converts their sizes into the quadratic character sum Σ_x χ(x³ + ax + b), which is the quantity that the
  Hasse–Weil bound (bsd-142) controls. Euler's criterion says that for a ≠ 0 in ZMod p, a^((p−1)/2) = 1 when
  a is a square and = −1 when it is not; and χ(0) = 0 with 0^((p−1)/2) = 0, since (p−1)/2 ≥ 1 for p ≥ 3.
  So each x contributes χ(f(x)) = (f(x)^((p−1)/2) as ±1) on the set where f(x) ≠ 0, and 0 elsewhere. Mathlib
  has quadraticChar and Euler's criterion (ZMod.euler_criterion or the power form in ZMod); the proof is a
  sum over the three cases of the filter. The statement is true. Only the counting bookkeeping is new.
sketch: |
  (1) Show pointwise: quadraticChar (ZMod p) y = if y^((p−1)/2) = 1 then 1 else if y^((p−1)/2) = −1 then −1
  else 0, for every y : ZMod p. Use quadraticChar_apply with the zero case and ZMod.euler_criterion for
  y ≠ 0 (note p/2 = (p−1)/2 for odd p). (2) Rewrite the sum as the sum of indicator values, and split it with
  Finset.sum_filter / Finset.card_filter into the two level sets. (3) Close with the arithmetic of the
  filters, which are disjoint because 1 ≠ −1 when p ≠ 2.
