id: bsd-392
problem: bsd
title: 'Euclid step 7 of the bsd-361 resultant chain: lc(B)^2 A = Q B + g S over any field, with explicit polynomials A, B, S of formal degrees 3, 2 and 1'
status: open
imports:
- Mathlib
open:
- Polynomial
depends: []
statement: |
  ∀ (K : Type) [Field K] (a b : K) (A B : K[X]),
      A = (C (4520632384 * a ^ 9 - 67187764656 * a ^ 6 * b ^ 2 - 555872475636 * a ^ 3 * b ^ 4 - 887464643625 * b ^ 6) * X ^ 3
        + C (35925337728 * a ^ 8 * b + 64238173632 * a ^ 5 * b ^ 3 - 145324312920 * a ^ 2 * b ^ 5) * X ^ 2
        + C (-1186543424 * a ^ 10 + 38146234608 * a ^ 7 * b ^ 2 + 37866059172 * a ^ 4 * b ^ 4 - 260485314075 * a * b ^ 6) * X
        + C (-1433909888 * a ^ 9 * b + 5898847680 * a ^ 6 * b ^ 3 - 44831173032 * a ^ 3 * b ^ 5 - 218934009000 * b ^ 7)) →
      B = (C (-162397392 * a ^ 6 - 2291228856 * a ^ 3 * b ^ 2 + 2817348075 * b ^ 4) * X ^ 2
        + C (73363968 * a ^ 5 * b - 3616493184 * a ^ 2 * b ^ 3) * X
        + C (3400336 * a ^ 7 + 182342232 * a ^ 4 * b ^ 2 - 1463697135 * a * b ^ 4)) →
      ∃ Q S : K[X], Q.natDegree ≤ 1 ∧ S.natDegree ≤ 1 ∧
        C (9*(54132464*a ^ 6 + 763742952*a ^ 3*b ^ 2 - 939116025*b ^ 4) ^ 2) * A = Q * B + C (24*(4520632384*a ^ 9 - 67187764656*a ^ 6*b ^ 2 - 555872475636*a ^ 3*b ^ 4 - 887464643625*b ^ 6) ^ 2) * S
context: |
  Step 7 of the Euclid chain for bsd-361 (after bsd-385, which gives the first remainder). Here A and B are the two previous remainders, with formal degrees 3 and 2, and S is the primitive part of the pseudo-remainder of A by B: lc(B)^2 A = Q B + g S, where lc(B) is the leading coefficient of B in X and g ∈ ℤ[a, b] is the content of the pseudo-remainder (the gcd of its coefficients). Degree of Q is at most 1, and S has degree at most 1. The identity was checked by exact expansion over ℤ[a, b][X] (sympy). It is a ring identity, so it holds over every field. It is stated with A, B, S as explicit polynomials so that the statement elaborates within the checker's default heartbeat limit; Q is only in the proof.
sketch: |
  Substitute A, B, S (subst). Give the explicit quotient Q, prove the two degree bounds by compute_degree!, and prove the identity by simp only [map_pow, map_mul, map_add, map_sub, map_neg, map_ofNat, map_natCast, Nat.cast_ofNat] then ring. Proofs may set maxHeartbeats for the proof of main.
