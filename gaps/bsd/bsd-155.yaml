id: bsd-155
problem: bsd
title: 'Singular short cubic: if 4a³ + 27b² = 0 over a prime field F_p with p ≠ 2, 3, then x³ + ax + b has a double root, i.e. a = −3e² and b = 2e³ for some e'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (p : ℕ) [Fact p.Prime] (a b : ZMod p), p ≠ 2 → p ≠ 3 → 4 * a ^ 3 + 27 * b ^ 2 = 0 →
    ∃ e : ZMod p, a = -3 * e ^ 2 ∧ b = 2 * e ^ 3
context: |
  First piece of the singular case of bsd-142. The discriminant of x³ + ax + b is −(4a³ + 27b²), so 4a³ + 27b² = 0 is
  exactly the condition that the cubic has a repeated root. Over F_p with p ≠ 2, 3 the double root is e = −3b/(2a)
  when a ≠ 0, and e = 0 when a = 0 (then 27b² = 0 forces b = 0). Indeed (x − e)²(x + 2e) = x³ − 3e²x + 2e³, so
  a = −3e² and b = 2e³ say exactly that x³ + ax + b = (x − e)²(x + 2e). The statement is true and elementary. It does
  not decide any Millennium problem.
sketch: |
  by_cases ha : a = 0. If a = 0 then 27 b² = 0, and 27 ≠ 0 in ZMod p (p ≠ 3, prime), so b = 0; take e = 0.
  If a ≠ 0, take e = −3b/(2a) (2a ≠ 0 since p ≠ 2). Then a = −3e² and b = 2e³ reduce, after field_simp, to
  4a³ + 27b² = 0 together with b·(4a³ + 27b²) = 0, which linear_combination closes from the hypothesis.
  Use ZMod.natCast_self_eq_zero / ZMod.natCast_eq_zero_iff style lemmas to get (27 : ZMod p) ≠ 0 and (2 : ZMod p) ≠ 0.
