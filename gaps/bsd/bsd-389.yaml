statement: |
  ∀ (K : Type) [Field K] (a b : K) (A B : K[X]),
      A = (C (-17803094800 * a ^ 6 - 62043251400 * a ^ 3 * b ^ 2 - 15785128125 * b ^ 4) * X ^ 6
        + C (-77117220288 * a ^ 5 * b - 112757346000 * a ^ 2 * b ^ 3) * X ^ 5
        + C (-12187440464 * a ^ 7 - 266306742792 * a ^ 4 * b ^ 2 - 224634515625 * a * b ^ 4) * X ^ 4
        + C (-13976339840 * a ^ 6 * b - 269048930400 * a ^ 3 * b ^ 3 - 167079510000 * b ^ 5) * X ^ 3
        + C (-7238199088 * a ^ 8 - 58221799704 * a ^ 5 * b ^ 2 - 61392716775 * a ^ 2 * b ^ 4) * X ^ 2
        + C (-17069694656 * a ^ 7 * b - 145620304848 * a ^ 4 * b ^ 3 - 101801934000 * a * b ^ 5) * X
        + C (183765136 * a ^ 9 - 6154081240 * a ^ 6 * b ^ 2 - 63431895555 * a ^ 3 * b ^ 4 - 39827092500 * b ^ 6)) →
      B = (C (-90523142400 * a ^ 9 - 31512061152 * a ^ 6 * b ^ 2 + 4317258722400 * a ^ 3 * b ^ 4 - 436593543750 * b ^ 6) * X ^ 5
        + C (-636093694656 * a ^ 8 * b - 3499761761568 * a ^ 5 * b ^ 3 + 8885014456500 * a ^ 2 * b ^ 5) * X ^ 4
        + C (4496739200 * a ^ 10 - 604284248160 * a ^ 7 * b ^ 2 - 5159026711800 * a ^ 4 * b ^ 4 + 4671390993750 * a * b ^ 6) * X ^ 3
        + C (-104602815552 * a ^ 9 * b + 1525040784 * a ^ 6 * b ^ 3 + 2402234698500 * a ^ 3 * b ^ 5 - 155926265625 * b ^ 7) * X ^ 2
        + C (-9623862400 * a ^ 11 - 453119241024 * a ^ 8 * b ^ 2 - 1827800593992 * a ^ 5 * b ^ 4 + 3584608911000 * a ^ 2 * b ^ 6) * X
        + C (-3351648256 * a ^ 10 * b - 224166054960 * a ^ 7 * b ^ 3 - 1107220275720 * a ^ 4 * b ^ 5 + 1180081963125 * a * b ^ 7)) →
      ∃ Q S : K[X], Q.natDegree ≤ 1 ∧ S.natDegree ≤ 4 ∧
        C (36*(15087190400*a ^ 9 + 5252010192*a ^ 6*b ^ 2 - 719543120400*a ^ 3*b ^ 4 + 72765590625*b ^ 6) ^ 2) * A = Q * B + C (3750*(4*a ^ 3 + 27*b ^ 2)*(712123792*a ^ 6 + 2481730056*a ^ 3*b ^ 2 + 631405125*b ^ 4) ^ 2) * S
context: |
  Step 4 of the Euclid chain for bsd-361 (after bsd-385, which gives the first remainder). Here A and B are the two previous remainders, with formal degrees 6 and 5, and S is the primitive part of the pseudo-remainder of A by B: lc(B)^2 A = Q B + g S, where lc(B) is the leading coefficient of B in X and g ∈ ℤ[a, b] is the content of the pseudo-remainder (the gcd of its coefficients). Degree of Q is at most 1, and S has degree at most 4. The identity was checked by exact expansion over ℤ[a, b][X] (sympy). It is a ring identity, so it holds over every field. It is stated with A, B, S as explicit polynomials so that the statement elaborates within the checker's default heartbeat limit; Q is only in the proof.
sketch: |
  Substitute A, B, S (subst). Give the explicit quotient Q, prove the two degree bounds by compute_degree!, and prove the identity by simp only [map_pow, map_mul, map_add, map_sub, map_neg, map_ofNat, map_natCast, Nat.cast_ofNat] then ring. Proofs may set maxHeartbeats for the proof of main.
