id: bsd-399
problem: bsd
title: 'Degree form nonnegative under the Hasse-type discriminant bound: for integers a, p, m, n with a² ≤ 4p, the form m² − a m n + p n² is nonnegative'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (a p m n : ℤ), a ^ 2 ≤ 4 * p → 0 ≤ m ^ 2 - a * m * n + p * n ^ 2
context: |
  The degree form of m − nπ is Q(m, n) = m² − a m n + p n² with a = p + 1 − #E(F_p). Hasse's bound (bsd-024) gives
  a² ≤ 4p, and bsd-089 asks for Q ≥ 0 on all integers. This gap isolates the step that needs only the discriminant
  hypothesis a² ≤ 4p: by completing the square, 4Q = (2m − a n)² + (4p − a²) n² (bsd-398), and both terms are nonnegative.
  So bsd-089 follows from bsd-024 (in its integer form, bsd-400) together with this gap and bsd-398. Stated over ℤ and
  with no curve, so it is a pure algebra fact; it does not need Hasse itself.
sketch: |
  From a² ≤ 4p we get 0 ≤ 4p − a². Multiply out: 4Q = (2m − a n)² + (4p − a²) n² ≥ 0, then divide by 4.
  Lean: `nlinarith [sq_nonneg (2 * m - a * n), mul_nonneg (sub_nonneg.mpr h) (sq_nonneg n)]` with `h : a ^ 2 ≤ 4 * p`,
  or the same argument through bsd-398 and `positivity`.
