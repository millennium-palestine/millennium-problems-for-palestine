id: bsd-160
problem: bsd
title: 'Zero count with multiplicity: a nonzero polynomial over a field with all Hasse derivatives of order < ℓ vanishing at each point of a finite set S has degree at least |S|·ℓ'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] (g : Polynomial K) (ℓ : ℕ) (S : Finset K), g ≠ 0 →
    (∀ x ∈ S, ∀ k : ℕ, k < ℓ → (Polynomial.hasseDeriv k g).eval x = 0) →
    S.card * ℓ ≤ g.natDegree
context: |
  Second elementary ingredient of Stepanov's method (see bsd-159 for the first). Stepanov's argument
  bounds the number of points of a curve by counting how many zeros, counted with multiplicity ℓ, an
  auxiliary polynomial must have; the counting inequality is this gap. The Hasse derivatives of order
  k < ℓ vanishing at x is exactly the statement (X − x)^ℓ divides g, so the product over S of the
  (X − x)^ℓ is a divisor of g, and comparing degrees gives |S|·ℓ ≤ deg g. This is true for every field and
  needs no curve. It does not by itself bound any point count: the Stepanov estimate that makes the
  zero count useful (the derivative computation on the curve) is not in this gap, and so bsd-142 stays
  open. Mathlib pieces: `Polynomial.taylor_coeff` (the coefficients of `taylor x g` are the Hasse
  derivatives at x), `Polynomial.X_pow_dvd_iff`, `Polynomial.taylor_taylor`, `Finset.prod_dvd_of_coprime`,
  `Polynomial.isCoprime_X_sub_C_of_isUnit_sub`, `Polynomial.natDegree_le_of_dvd`.
sketch: |
  For x ∈ S: the Taylor shift taylor x g has coefficient d equal to (hasseDeriv d g)(x) (`taylor_coeff`),
  which is 0 for d < ℓ, so X^ℓ divides taylor x g (`X_pow_dvd_iff`). Undo the shift with taylor (−x)
  (`taylor_taylor`, `taylor_zero`) to get (X − C x)^ℓ ∣ g. For distinct x, y in S the factors
  (X − C x)^ℓ and (X − C y)^ℓ are coprime (`isCoprime_X_sub_C_of_isUnit_sub`, `IsCoprime.pow`), so
  ∏_{x∈S} (X − C x)^ℓ divides g (`Finset.prod_dvd_of_coprime`). Compare natural degrees
  (`natDegree_le_of_dvd`, `natDegree_prod`, `natDegree_pow`, `natDegree_X_sub_C`), giving |S|·ℓ ≤ deg g.
