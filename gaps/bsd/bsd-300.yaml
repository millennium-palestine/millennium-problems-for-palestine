id: bsd-300
problem: bsd
title: 'Squarefree preΨ′ 5 in characteristic 2 with a₁ = 0: over a field with 2 = 0 and W elliptic with a₁ = 0, preΨ′ 5 is squarefree'
status: open
imports:
- Mathlib
open: []
depends:
- bsd-282
- bsd-283
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) [W.IsElliptic],
    (2 : K) = 0 → W.a₁ = 0 → Squarefree (W.preΨ' 5)
context: |
  First piece of the split of bsd-297 (characteristic 2). With a₁ = 0 and 2 = 0 the terms 4a₂, 2a₄ and a₁a₃ vanish,
  so b₂ = b₄ = 0, b₆ = a₃², and the discriminant is Δ = −27 b₆² = −a₃⁴, a unit because W is elliptic. The coefficient
  a₂ enters only through the constant b₈, which is left general. The polynomial is then a closed form with no Bezout
  search: preΨ′ 5 = −a₃⁸ − g³ with g = X⁴ + a₃² X + b₈, and g′ = a₃². The certificate is C(a₃²) · f − g · f′ = C(−a₃¹⁰),
  so f is squarefree by bsd-282. Nothing here is checked in Lean.
sketch: |
  Rewrite with bsd-283: preΨ′ 5 = preΨ₄ · Ψ₂Sq² − Ψ₃³. Over a field with 2 = 0, a₁ = 0 gives b₂ = 0, b₄ = 0, b₆ = a₃²,
  so Ψ₂Sq = a₃² and Ψ₃ = X⁴ + a₃² X + b₈. The coefficient 10 = 0 kills the b₈ X² term of preΨ₄, so preΨ₄ = −a₃⁴.
  Hence f = C(−a₃⁸) − g³. Derivative: f′ = −g² · C(a₃²) (3 = 1, 4 = 0, and the constant b₈ has zero derivative).
  With c = −a₃¹⁰ ≠ 0 (from Δ = −a₃⁴ ≠ 0), C(a₃²) · f + (−g) · f′ = C(−a₃¹⁰). Then bsd-282 gives Squarefree f.
  Mathlib: WeierstrassCurve.preΨ'_odd, WeierstrassCurve.Ψ₃, Ψ₂Sq, preΨ₄, Polynomial.derivative, bsd-282, bsd-283.
