statement: |
  ∀ (K : Type) [Field K] (a b : K) (A B : K[X]),
      A = (C (791120 * a ^ 3 + 4873500 * b ^ 2) * X ^ 9
        + C (933120 * a ^ 2 * b) * X ^ 8
        + C (29760 * a ^ 4 + 5799600 * a * b ^ 2) * X ^ 7
        + C (-3815040 * a ^ 3 * b - 6156000 * b ^ 3) * X ^ 6
        + C (-1264800 * a ^ 5 - 15069240 * a ^ 2 * b ^ 2) * X ^ 5
        + C (-7284480 * a ^ 4 * b - 58968000 * a * b ^ 3) * X ^ 4
        + C (-248000 * a ^ 6 - 9342480 * a ^ 3 * b ^ 2 - 61560000 * b ^ 4) * X ^ 3
        + C (-1856640 * a ^ 5 * b - 11599200 * a ^ 2 * b ^ 3) * X ^ 2
        + C (-101680 * a ^ 7 - 4985220 * a ^ 4 * b ^ 2 - 28667520 * a * b ^ 4) * X
        + C (-44800 * a ^ 6 * b - 2256640 * a ^ 3 * b ^ 3 - 13132800 * b ^ 5)) →
      B = (C (-66446295379200 * a ^ 8 - 1139787278409600 * a ^ 5 * b ^ 2 - 4666104796050000 * a ^ 2 * b ^ 4) * X ^ 8
        + C (275474939904000 * a ^ 7 * b + 1859455844352000 * a ^ 4 * b ^ 3) * X ^ 7
        + C (-250623018624000 * a ^ 9 - 2384814094272000 * a ^ 6 * b ^ 2 - 4678483850280000 * a ^ 3 * b ^ 4) * X ^ 6
        + C (-335073939609600 * a ^ 8 * b - 2126866207564800 * a ^ 5 * b ^ 3 + 910459472400000 * a ^ 2 * b ^ 5) * X ^ 5
        + C (-150385583040000 * a ^ 10 - 2632806802080000 * a ^ 7 * b ^ 2 - 10919502786780000 * a ^ 4 * b ^ 4) * X ^ 4
        + C (-18380642611200 * a ^ 9 * b - 895504784025600 * a ^ 6 * b ^ 3 - 5207189263200000 * a ^ 3 * b ^ 5) * X ^ 3
        + C (-75740183270400 * a ^ 11 - 836871926054400 * a ^ 8 * b ^ 2 - 1280769783969600 * a ^ 5 * b ^ 4 + 6191124412320000 * a ^ 2 * b ^ 6) * X ^ 2
        + C (-151031338137600 * a ^ 10 * b - 2038923064857600 * a ^ 7 * b ^ 3 - 6881365343894400 * a ^ 4 * b ^ 5) * X
        + C (1877612563200 * a ^ 12 - 28145358998400 * a ^ 9 * b ^ 2 - 643925816802000 * a ^ 6 * b ^ 4 - 2486672467776000 * a ^ 3 * b ^ 6)) →
