id: bsd-301
problem: bsd
title: 'Squarefree preΨ′ 5 in characteristic 2 with a₁ ≠ 0: over a field with 2 = 0 and W elliptic with a₁ ≠ 0, preΨ′ 5 is squarefree'
status: open
imports:
- Mathlib
open: []
depends: []
statement: |
  ∀ (K : Type) [Field K] (W : WeierstrassCurve K) [W.IsElliptic],
    (2 : K) = 0 → W.a₁ ≠ 0 → Squarefree (W.preΨ' 5)
context: |
  Second piece of the split of bsd-297 (characteristic 2), the complement of bsd-300. With a₁ ≠ 0 the square b₂ = a₁² is
  nonzero, and the curve cannot be put in the form a₁ = 0. In characteristic 2 the shift x ↦ x + r with r = a₃ / a₁ gives
  a₃ = 0 (a₃ ↦ a₃ + r a₁), so the case reduces to a₃ = 0 with a₁ ≠ 0, which is a case of bsd-297 that the notes do not
  compute. The statement is true for the same reason as bsd-297: the roots of preΨ′ 5 are the x-coordinates of the 12
  pairs ±P of nonzero 5-torsion points, which are distinct on a nonsingular curve. Nothing here is checked in Lean.
sketch: |
  Not yet split further. Candidate routes: the shift x ↦ x + a₃ · a₁⁻¹ (valid since a₁ ≠ 0) with a transport lemma for
  preΨ′ 5, then a Bezout identity A·f + B·f′ = c·Δᵏ over 𝔽₂[a₁, a₂, a₄, a₆][X] found by weighted linear algebra, with
  bsd-282 for squarefreeness; or a direct argument through the Frobenius-fixed points. Mathlib: WeierstrassCurve.preΨ'_odd,
  bsd-282, bsd-283.
dead: []
