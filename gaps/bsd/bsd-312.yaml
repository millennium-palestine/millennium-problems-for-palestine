id: bsd-312
problem: bsd
title: 'Finite five-torsion: over a field with 5 nonzero, the points of an elliptic curve killed by 5 form a finite type'
status: open
imports:
- Mathlib
- MPP.Solutions.Bsd246
open: []
depends:
- bsd-217
- bsd-246
statement: |
  ∀ (K : Type) [Field K] [DecidableEq K] (W : WeierstrassCurve K) [W.IsElliptic],
    (5 : K) ≠ 0 → Finite {P : W.toAffine.Point // (5 : ℤ) • P = 0}
context: |
  The finiteness step that bsd-279 needs before its Nat.card bound (bsd-279 counts Nat.card of the five-torsion
  points, which is 0 for an infinite type). The five-torsion case of bsd-198 is bsd-246 (merged): an affine point killed by
  5 has x-coordinate a root of preΨ′ 5. Proof: preΨ′ 5 ≠ 0 by the Mathlib lemma preΨ'_ne_zero (since (5 : K) ≠ 0), so its
  roots form a finite set. For a fixed x, bsd-217 says any two affine points with x-coordinate x are equal or negatives of
  each other, so at most two affine points have x-coordinate x. Hence the five-torsion set lies in {0} together with
  finitely many pairs. This is a corollary of bsd-246 and bsd-217; it was first proposed with the bsd-246 conclusion as a
  hypothesis (before bsd-246 was on main). Not checked in Lean.
sketch: |
  Apply the argument to the hypothesis supplied by bsd-246. Let Rts := {x : K | (W.preΨ' 5).eval x = 0}, finite by
  Polynomial.finite_setOf_isRoot and preΨ'_ne_zero. For each x, let F x = {P | ∃ y h, P = some x y h}. If F x is
  nonempty with a point some x y0 h0, bsd-217 puts F x inside {some x y0 h0, −some x y0 h0}; otherwise F x is empty.
  The five-torsion set lies in insert 0 (⋃ x ∈ Rts, F x), a finite set (Set.Finite.biUnion, Set.Finite.insert).
  Mathlib: Polynomial.finite_setOf_isRoot, WeierstrassCurve.preΨ'_ne_zero, Set.Finite.biUnion, Set.Finite.subset,
  Set.Finite.to_subtype, WeierstrassCurve.Affine.Point.neg_some.
dead: []
